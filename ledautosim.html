<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LED Auto Simulator | ShyneTyme Works</title>
  <meta name="theme-color" content="#030918">
  <link rel="stylesheet" href="assets/css/site.css?v=shared-ui-15">
  <style>
    html,
    body {
      margin: 0;
      min-height: 100%;
      display: grid;
      place-items: center;
      color: #fff;
      background: #030918;
      font-family: system-ui, sans-serif;
    }

    p {
      color: #b8c6dc;
    }
  </style>
</head>
<body>
  <main aria-live="polite">
    <h1>Loading LED SIM Auto...</h1>
    <p>Preparing the unified zone controls and ten-step sequence.</p>
  </main>

  <script>
    (() => {
      "use strict";

      // BEGIN API CALL: Load the approved Auto SIM page package.
      async function loadAutoPage() {
        const pageParts = await Promise.all(
          [1, 2, 3, 4, 5, 6].map(async (partNumber) => {
            const response = await fetch(
              `assets/sim-auto/car-base-${partNumber}.txt?v=20260807-auto-theme-v2`,
              {
                cache: "no-store",
                credentials: "same-origin"
              }
            );

            if (!response.ok) {
              throw new Error(`Auto SIM page part ${partNumber} failed.`);
            }

            return (await response.text()).trim();
          })
        );

        const pageBytes = Uint8Array.from(
          atob(pageParts.join("")),
          (character) => character.charCodeAt(0)
        );
        const pageHtml = new TextDecoder()
          .decode(pageBytes)
          .replaceAll("Â", "")
          .replaceAll("·", " - ");
        const parsedPage = new DOMParser().parseFromString(
          pageHtml,
          "text/html"
        );

        const sharedControls = parsedPage.createElement("link");
        sharedControls.rel = "stylesheet";
        sharedControls.href = "assets/css/sim-controls-shared.css?v=20260806-unified-auto-v1";
        sharedControls.dataset.shynetymeSimControls = "true";
        parsedPage.head.appendChild(sharedControls);

        const sequenceStyles = parsedPage.createElement("link");
        sequenceStyles.rel = "stylesheet";
        sequenceStyles.href = "assets/css/sim-auto-sequence.css?v=20260806-auto-sequence-v1";
        sequenceStyles.dataset.shynetymeAutoSequenceStyles = "true";
        parsedPage.head.appendChild(sequenceStyles);

        const sequenceScript = parsedPage.createElement("script");
        sequenceScript.src = "assets/js/sim-auto-sequence.js?v=20260806-auto-sequence-v1";
        sequenceScript.defer = true;
        sequenceScript.dataset.shynetymeAutoSequence = "true";
        parsedPage.body.appendChild(sequenceScript);

        document.open();
        document.write(`<!doctype html>${parsedPage.documentElement.outerHTML}`);
        document.close();
      }
      // END API CALL: Load the approved Auto SIM page package.

      loadAutoPage().catch((error) => {
        console.error(error);
        document.body.innerHTML = `
          <main>
            <h1>LED SIM Auto could not load.</h1>
            <p>Refresh the page to retry the production assets.</p>
          </main>
        `;
      });
    })();
  </script>
</body>
</html>

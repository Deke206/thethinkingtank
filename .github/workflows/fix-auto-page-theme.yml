name: Repair Auto SIM theme and preview frame
on:
  push:
    branches: [agent/fix-auto-page-theme]
    paths: [.github/workflows/fix-auto-page-theme.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-auto-page-theme
          fetch-depth: 0
      - name: Repair embedded Auto SIM page
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          parts = [Path(f'assets/sim-auto/car-base-{n}.txt') for n in range(1, 7)]
          encoded = ''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          html = base64.b64decode(encoded).decode('utf-8')

          replacements = {
              'https://shynetyme.works/sim/ledsimauto.html': 'https://shynetyme.works/ledautosim.html',
              '../css/site.css?v=shared-ui-9': 'assets/css/site.css?v=shared-ui-15',
              '../css/site-navigation.css?v=shared-ui-9': 'assets/css/site-navigation.css?v=shared-ui-15',
              '../css/site-chuck.css?v=shared-ui-9': 'assets/css/site-chuck.css?v=shared-ui-15',
              '../css/site-chuck-cloud.css?v=20260725-cloud-shift-v1': 'assets/css/site-chuck-cloud.css?v=20260725-cloud-shift-v1',
              '../build-my-bike.html': 'ledbikesim.html',
              'href="ledsimauto.html"': 'href="ledautosim.html"',
              '../led-catalog.html': 'led-catalog.html',
              '../aboutme.html': 'aboutme.html',
              '../contact.html': 'contact.html',
              '../index.html#effects': 'index.html#effects',
              '../index.html': 'index.html',
              '.center{overflow:hidden}': '.center{overflow:hidden;border:2px solid #31e6ff66;box-shadow:0 20px 45px #0006,0 0 0 1px #31e6ff22 inset}',
          }

          for old, new in replacements.items():
              if old not in html:
                  raise SystemExit(f'Expected source fragment not found: {old}')
              html = html.replace(old, new)

          # Match the other simulator pages' shared visual stack.
          anchor = '<link rel="stylesheet" href="assets/css/site-navigation.css?v=shared-ui-15">'
          additions = (
              anchor
              + '<link rel="stylesheet" href="assets/css/site-hero.css?v=shared-ui-15" data-shynetyme-hero="true">'
              + '<link rel="stylesheet" href="assets/css/site-motion.css?v=shared-ui-15" data-shynetyme-motion="true">'
          )
          if 'assets/css/site-hero.css?v=shared-ui-15' not in html:
              html = html.replace(anchor, additions, 1)

          # The breadcrumb already exists; preserve it and verify its root-level destination.
          expected_breadcrumb = '<nav id="page-subheader" aria-label="Breadcrumb"><div id="page-subheader-row"><ol id="page-subheader-text"><li class="page-subheader-item"><a href="index.html">Home</a></li><li class="page-subheader-item"><span aria-current="page">LED SIM AUTO</span></li></ol></div></nav>'
          if expected_breadcrumb not in html:
              raise SystemExit('Corrected Auto SIM breadcrumb was not found after path repair.')

          # Preserve current fixed shared navigation revision.
          if 'site-guide.js?v=shared-ui-15' not in html:
              raise SystemExit('Auto SIM package is not using shared-ui-15 site-guide.')

          updated = base64.b64encode(html.encode('utf-8')).decode('ascii')
          size = len(updated) // len(parts)
          cursor = 0
          for i, path in enumerate(parts):
              if i == len(parts) - 1:
                  chunk = updated[cursor:]
              else:
                  chunk = updated[cursor:cursor + size]
                  cursor += size
              path.write_text(chunk + '\n', encoding='utf-8')

          # Verify round-trip integrity.
          verify = base64.b64decode(''.join(p.read_text(encoding='utf-8').strip() for p in parts)).decode('utf-8')
          checks = [
              'assets/css/site.css?v=shared-ui-15',
              'assets/css/site-navigation.css?v=shared-ui-15',
              'assets/css/site-hero.css?v=shared-ui-15',
              'assets/css/site-motion.css?v=shared-ui-15',
              'href="ledbikesim.html"',
              'href="ledautosim.html"',
              'href="led-catalog.html"',
              'aria-label="Breadcrumb"',
              'Live aligned preview',
              '.center{overflow:hidden;border:2px solid #31e6ff66',
          ]
          for check in checks:
              if check not in verify:
                  raise SystemExit(f'Validation failed: {check}')
          for stale in ['../css/site.css', '../css/site-navigation.css', '../build-my-bike.html', 'href="ledsimauto.html"', '/sim/ledsimauto.html']:
              if stale in verify:
                  raise SystemExit(f'Stale Auto SIM reference remains: {stale}')
          PY
      - name: Link site theme on Auto loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('ledautosim.html')
          html = path.read_text(encoding='utf-8')
          marker = '  <meta name="theme-color" content="#030918">\n'
          link = '  <link rel="stylesheet" href="assets/css/site.css?v=shared-ui-15">\n'
          if link not in html:
              if marker not in html:
                  raise SystemExit('Auto loader theme-color marker not found.')
              html = html.replace(marker, marker + link, 1)
          path.write_text(html, encoding='utf-8')
          PY
      - name: Validate affected Auto page source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'assets/css/site.css?v=shared-ui-15' ledautosim.html
          cat assets/sim-auto/car-base-{1,2,3,4,5,6}.txt | tr -d '\n\r' | base64 -d > /tmp/auto.html
          grep -Fq 'assets/css/site.css?v=shared-ui-15' /tmp/auto.html
          grep -Fq 'aria-label="Breadcrumb"' /tmp/auto.html
          grep -Fq 'Live aligned preview' /tmp/auto.html
          grep -Fq '.center{overflow:hidden;border:2px solid #31e6ff66' /tmp/auto.html
          ! grep -Fq '../css/site.css' /tmp/auto.html
          ! grep -Fq 'href="ledsimauto.html"' /tmp/auto.html
      - name: Commit only production repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspect-auto-page-structure.yml
          rm -f .github/workflows/fix-auto-page-theme.yml
          git add -A
          git diff --cached --check
          git config user.name 'Deke310'
          git config user.email '135410011+Deke206@users.noreply.github.com'
          git commit -m 'fix: restore Auto SIM theme breadcrumb and preview frame'
          git push origin HEAD:agent/fix-auto-page-theme

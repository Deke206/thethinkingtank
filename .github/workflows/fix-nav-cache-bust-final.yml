name: Fix navigation cache bust final

on:
  push:
    branches:
      - agent/fix-nav-cache-bust-v2
    paths:
      - .github/workflows/fix-nav-cache-bust-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-nav-cache-bust-v2
          fetch-depth: 0

      - name: Bump all root pages to shared-ui-17
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          revision = "shared-ui-17"
          changed = []
          pattern = re.compile(r'assets/js/site-guide\.js\?v=[A-Za-z0-9._-]+')
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'assets/js/site-guide.js' not in text:
                  continue
              new = pattern.sub(f'assets/js/site-guide.js?v={revision}', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.as_posix())

          guide = Path('assets/js/site-guide.js')
          text = guide.read_text(encoding='utf-8')
          new = re.sub(r'const sharedRevision = scriptUrl\.searchParams\.get\("v"\) \|\| "shared-ui-[0-9]+";', f'const sharedRevision = scriptUrl.searchParams.get("v") || "{revision}";', text, count=1)
          if new == text:
              raise SystemExit('site-guide fallback revision was not updated')
          guide.write_text(new, encoding='utf-8')
          changed.append(guide.as_posix())
          print('changed:', *changed, sep='\n- ')
          PY

      - name: Validate navigation cache bust
        shell: bash
        run: |
          set -euo pipefail
          node --check assets/js/site-guide.js
          python - <<'PY'
          from pathlib import Path
          import re
          pages = []
          for path in Path('.').glob('*.html'):
              text = path.read_text(encoding='utf-8')
              if 'assets/js/site-guide.js' in text:
                  pages.append(path.name)
                  refs = re.findall(r'assets/js/site-guide\.js\?v=([^"\']+)', text)
                  assert refs and all(ref == 'shared-ui-17' for ref in refs), (path, refs)
          assert len(pages) >= 8, pages
          guide = Path('assets/js/site-guide.js').read_text(encoding='utf-8')
          assert 'const siteRoot = new URL("../../", scriptUrl);' in guide
          assert '|| "shared-ui-17";' in guide
          print('validated pages:', ', '.join(sorted(pages)))
          PY
          node - <<'NODE'
          const root = new URL('../../', 'https://shynetyme.works/assets/js/site-guide.js?v=shared-ui-17');
          for (const page of ['ledbikesim.html','ledautosim.html','ledhomesim.html']) {
            const resolved = new URL(page, root).href;
            if (resolved !== `https://shynetyme.works/${page}`) throw new Error(resolved);
          }
          console.log('navigation cache-bust URL test passed');
          NODE

      - name: Commit verified cache bust
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-nav-cache-bust-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: force corrected simulator navigation reload"
          git push origin HEAD:agent/fix-nav-cache-bust-v2

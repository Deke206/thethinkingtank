name: Consolidate support folders into assets
on:
  push:
    branches: [agent/consolidate-assets]
    paths: [.github/workflows/consolidate-assets-once.yml]
permissions:
  contents: write
jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/consolidate-assets
          fetch-depth: 0
      - name: Move folders and rewrite references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import os,re,subprocess
          root=Path('.').resolve(); moved=('css','data','docs','js','scripts')
          old_files={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_file() and '.git' not in p.parts}
          old_dirs={p.relative_to(root).as_posix() for p in root.rglob('*') if p.is_dir() and '.git' not in p.parts}; old_dirs.add('.')
          for name in moved:
              src=Path(name); dst=Path('assets')/name
              if not src.is_dir(): raise SystemExit(f'Missing root folder: {name}')
              if dst.exists(): raise SystemExit(f'Target exists: {dst}')
              subprocess.run(['git','mv',name,dst.as_posix()],check=True)
          def old_file(new):
              rel=new.relative_to(root).as_posix()
              for name in moved:
                  prefix=f'assets/{name}/'
                  if rel.startswith(prefix): return PurePosixPath(rel[len('assets/'):])
              return PurePosixPath(rel)
          def new_target(old):
              return PurePosixPath('assets')/old if old.parts and old.parts[0] in moved else old
          def norm(base,raw,root_logical=False):
              raw=raw.replace('\\','/')
              p=PurePosixPath(raw.lstrip('/')) if raw.startswith('/') or root_logical else base/raw
              out=[]
              for part in p.parts:
                  if part in ('','.'): continue
                  if part=='..':
                      if out: out.pop()
                  else: out.append(part)
              return PurePosixPath(*out) if out else PurePosixPath('.')
          def relref(file,target,absolute=False):
              if absolute:return '/'+target.as_posix()
              start=file.relative_to(root).parent.as_posix() or '.'
              return os.path.relpath(target.as_posix(),start).replace('\\','/')
          def split(v):
              m=re.match(r'^([^?#]*)(.*)$',v,re.S); return m.group(1),m.group(2)
          attr=re.compile(r'(?P<h>\b(?:src|href)\s*=\s*["\'])(?P<u>[^"\']+)(?P<t>["\'])',re.I)
          for path in root.rglob('*.html'):
              text=path.read_text(encoding='utf-8'); base=old_file(path).parent
              def f(m):
                  v=m.group('u')
                  if re.match(r'^(?:https?:|mailto:|tel:|data:|javascript:|#)',v,re.I):return m.group(0)
                  raw,suf=split(v); target=norm(base,raw)
                  if target.as_posix() not in old_files and target.as_posix() not in old_dirs:return m.group(0)
                  return m.group('h')+relref(path,new_target(target),raw.startswith('/'))+suf+m.group('t')
              path.write_text(attr.sub(f,text),encoding='utf-8')
          cssurl=re.compile(r'url\((?P<q>["\']?)(?P<u>[^)"\']+)(?P=q)\)',re.I)
          for path in (root/'assets/css').rglob('*.css'):
              text=path.read_text(encoding='utf-8'); base=old_file(path).parent
              def f(m):
                  v=m.group('u').strip()
                  if re.match(r'^(?:https?:|data:|#)',v,re.I):return m.group(0)
                  raw,suf=split(v); target=norm(base,raw)
                  if target.as_posix() not in old_files:return m.group(0)
                  q=m.group('q') or ''; return f'url({q}{relref(path,new_target(target),raw.startswith("/"))}{suf}{q})'
              path.write_text(cssurl.sub(f,text),encoding='utf-8')
          qre=re.compile(r'(?P<q>["\'])(?P<u>(?:\.{0,2}/|/)?(?:assets|css|data|docs|js|scripts)/[^"\'\n]+)(?P=q)')
          exts={'.js','.mjs','.cjs','.json','.md','.txt','.py','.yml','.yaml','.xml','.svg','.webmanifest'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in exts or '.git' in path.parts:continue
              text=path.read_text(encoding='utf-8',errors='ignore'); base=old_file(path).parent
              def f(m):
                  v=m.group('u'); raw,suf=split(v); first=raw.lstrip('/').split('/',1)[0]
                  logical=not raw.startswith(('./','../','/')) and first in (*moved,'assets')
                  target=norm(base,raw,logical)
                  if target.as_posix() not in old_files and target.as_posix() not in old_dirs:return m.group(0)
                  nv=new_target(target).as_posix() if logical else relref(path,new_target(target),raw.startswith('/'))
                  return m.group('q')+nv+suf+m.group('q')
              path.write_text(qre.sub(f,text),encoding='utf-8')
          bare=re.compile(r'(?<![A-Za-z0-9_./-])(?P<d>css|data|docs|js|scripts)/(?P<r>[A-Za-z0-9_.\-/]+)')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.yml','.yaml','.md','.txt'} or '.git' in path.parts:continue
              text=path.read_text(encoding='utf-8',errors='ignore')
              text=bare.sub(lambda m:f'assets/{m.group("d")}/{m.group("r")}',text).replace('assets/assets/','assets/')
              path.write_text(text,encoding='utf-8')
          PY
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          for d in css data docs js scripts; do test ! -d "$d"; test -d "assets/$d"; done
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.'); missing=[]; rx=re.compile(r'\b(?:src|href)\s*=\s*["\']([^"\']+)["\']',re.I)
          for page in root.rglob('*.html'):
              for v in rx.findall(page.read_text(encoding='utf-8',errors='ignore')):
                  if re.match(r'^(?:https?:|mailto:|tel:|data:|javascript:|#)',v,re.I):continue
                  raw=v.split('#',1)[0].split('?',1)[0]
                  if not raw:continue
                  target=(root/raw.lstrip('/')) if raw.startswith('/') else page.parent/raw
                  if any(x in v for x in ('assets/','css/','js/','data/','docs/','scripts/')) and not target.exists():missing.append(f'{page}: {v}')
          if missing:raise SystemExit('Broken moved-asset refs:\n'+'\n'.join(missing[:80]))
          print('HTML asset references resolve.')
          PY
          if grep -RInE '(["'"'"'`(=]|^)(css|data|docs|js|scripts)/' --exclude-dir=.git --exclude-dir=assets .; then exit 1; fi
          git diff --check
      - name: Commit to main and remove temporary branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/consolidate-assets-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolidate support folders under assets"
          git push origin HEAD:main
          git push origin --delete agent/consolidate-assets

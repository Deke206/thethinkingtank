name: Remove legacy hero banner markup

on:
  push:
    paths:
      - '.github/workflows/remove-legacy-hero-banners.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove retired banner stacks and sparkle overlays
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          opening_div = re.compile(r'<div\b[^>]*>', re.I)
          div_tag = re.compile(r'<div\b[^>]*>|</div\s*>', re.I)

          def block_end(text, start):
              depth = 0
              for match in div_tag.finditer(text, start):
                  tag = match.group(0).lower()
                  if tag.startswith('<div'):
                      depth += 1
                  else:
                      depth -= 1
                      if depth == 0:
                          return match.end()
              raise ValueError(f'Unbalanced div starting at {start}')

          def has_class(tag, class_name):
              match = re.search(r'class=["\']([^"\']*)["\']', tag, re.I)
              return bool(match and class_name in match.group(1).split())

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              original = text

              starts = []
              for match in opening_div.finditer(text):
                  if has_class(match.group(0), 'hero-led-stack'):
                      starts.append(match.start())

              for start in reversed(starts):
                  end = block_end(text, start)
                  block = text[start:end]
                  hidden = ''
                  for inner in opening_div.finditer(block):
                      if has_class(inner.group(0), 'visually-hidden'):
                          hidden_end = block_end(block, inner.start())
                          hidden = block[inner.start():hidden_end]
                          break

                  line_start = text.rfind('\n', 0, start) + 1
                  indent = text[line_start:start]
                  replacement = ''
                  if hidden:
                      hidden_lines = hidden.strip().splitlines()
                      replacement = '\n'.join(indent + line.lstrip() for line in hidden_lines)

                  text = text[:start] + replacement + text[end:]

              text = re.sub(
                  r'\s*<div\b[^>]*class=["\'][^"\']*\bhero-carousel__sparkle\b[^"\']*["\'][^>]*>\s*</div>',
                  '',
                  text,
                  flags=re.I,
              )

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Cleaned:', ', '.join(changed) if changed else 'nothing')
          PY

      - name: Commit cleanup
        run: |
          rm .github/workflows/remove-legacy-hero-banners.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Remove retired hero banner markup sitewide'
          git push

name: Restore shared text breadcrumb ribbon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-text-breadcrumb-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-breadcrumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore text breadcrumb and move styling to body CSS
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          release = "shared-ui-3"

          matrix_path = Path("js/site-led-matrix.js")
          matrix_js = matrix_path.read_text(encoding="utf-8")
          matrix_js = re.sub(r"\n  function collectBreadcrumbText\(ticker\) \{.*?\n  \}\n", "\n", matrix_js, flags=re.S)
          matrix_js = matrix_js.replace('      this.rows = this.role === "breadcrumb" ? 10 : 11;', '      this.rows = 11;')
          matrix_js = matrix_js.replace('      this.rows = this.role === "breadcrumb"\n        ? (this.width < 560 ? 8 : 10)\n        : (this.width < 560 ? 9 : 11);', '      this.rows = this.width < 560 ? 9 : 11;')
          matrix_js = re.sub(r"\n  function transformBreadcrumb\(usedEffects, usedPalettes\) \{.*?\n  \}\n\n  function render", "\n\n  function render", matrix_js, flags=re.S)
          matrix_js = matrix_js.replace("    transformBreadcrumb(usedEffects, usedPalettes);\n", "")

          cleanup = '''
  function restoreBreadcrumbText() {
    document.querySelectorAll(".site-matrix-canvas--breadcrumb").forEach((canvas) => canvas.remove());
    document.querySelectorAll(".breadcrumb-ticker").forEach((ticker) => {
      ticker.classList.remove("breadcrumb-ticker--matrix");
      delete ticker.dataset.matrixReady;
    });
  }

'''
          if "function restoreBreadcrumbText()" not in matrix_js:
              matrix_js = matrix_js.replace("  function transformHero(usedEffects, usedPalettes) {", cleanup + "  function transformHero(usedEffects, usedPalettes) {")
          matrix_js = matrix_js.replace('    if (!document.body.classList.contains("led-magic-page")) transformHero(usedEffects, usedPalettes);', '    restoreBreadcrumbText();\n    if (!document.body.classList.contains("led-magic-page")) transformHero(usedEffects, usedPalettes);')
          matrix_path.write_text(matrix_js, encoding="utf-8")

          Path("css/site-led-matrix.css").write_text('''/* Canonical site-wide LED matrix styling for the hero ribbons. */
:root {
  --site-matrix-ribbon-height: clamp(46px, 4.4vw, 58px);
}

.site-matrix-ribbon {
  position: absolute;
  right: 0;
  left: 0;
  z-index: 5;
  height: var(--site-matrix-ribbon-height);
  overflow: hidden;
  contain: layout paint;
  isolation: isolate;
  background-color: #020611;
  background-image:
    radial-gradient(circle, rgba(49, 230, 255, .065) 0 1px, transparent 1.45px),
    radial-gradient(circle, rgba(255, 90, 185, .04) 0 1px, transparent 1.4px),
    linear-gradient(180deg, rgba(2, 6, 17, .98), rgba(6, 21, 47, .96));
  background-position: 0 0, 4px 4px, 0 0;
  background-size: 8px 8px, 10px 10px, auto;
  border-top: 2px solid rgba(49, 230, 255, .72);
  border-bottom: 2px solid rgba(255, 90, 185, .62);
  box-shadow: 0 0 18px rgba(49, 230, 255, .13), 0 0 24px rgba(255, 90, 185, .08), inset 0 1px 0 rgba(255, 255, 255, .08);
}

.site-matrix-ribbon::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.016) 0 1px, transparent 1px 4px),
    linear-gradient(90deg, rgba(2,6,17,.54), transparent 7%, transparent 93%, rgba(2,6,17,.54));
}

.site-matrix-ribbon--top { top: 0; }
.site-matrix-ribbon--bottom { bottom: 0; }

.site-matrix-canvas {
  position: relative;
  z-index: 1;
  display: block;
  width: 100%;
  height: 100%;
  opacity: 1;
  background: transparent;
  image-rendering: pixelated;
  filter:
    brightness(1.28)
    saturate(1.12)
    contrast(1.08)
    drop-shadow(0 0 4px rgba(49, 230, 255, .42));
}

@media (max-width: 1199.98px) { :root { --site-matrix-ribbon-height: 48px; } }
@media (max-width: 767.98px) { :root { --site-matrix-ribbon-height: 42px; } }
@media (max-width: 575.98px) {
  :root { --site-matrix-ribbon-height: 38px; }
  .site-matrix-canvas {
    filter: brightness(1.34) saturate(1.08) contrast(1.1) drop-shadow(0 0 3px rgba(49, 230, 255, .4));
  }
}
@media (max-width: 390px) { :root { --site-matrix-ribbon-height: 34px; } }
@media (max-height: 700px) and (min-width: 768px) { :root { --site-matrix-ribbon-height: 42px; } }
''', encoding="utf-8")

          body_path = Path("css/site.css")
          body_css = body_path.read_text(encoding="utf-8")
          body_css = re.sub(r"\n?/\* BEGIN shared body breadcrumb ribbon \*/.*?/\* END shared body breadcrumb ribbon \*/\n?", "\n", body_css, flags=re.S).rstrip()
          breadcrumb_css = r'''

/* BEGIN shared body breadcrumb ribbon */
.breadcrumb-ticker {
  position: relative;
  z-index: 3;
  display: flex;
  align-items: center;
  min-height: 3.25rem;
  overflow: hidden;
  color: #fff3dc;
  background:
    linear-gradient(90deg, rgba(2, 6, 17, .99), rgba(11, 28, 58, .97) 48%, rgba(18, 11, 42, .98) 72%, rgba(2, 6, 17, .99)) padding-box,
    linear-gradient(90deg, #ff304f, #ff8a00 22%, #ffe45e 40%, #ff5ab9 64%, #9b83ff 82%, #31e6ff) border-box;
  border: 0;
  border-bottom: 3px solid transparent;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), inset 0 -10px 22px rgba(255, 90, 185, .045), 0 9px 20px rgba(0, 0, 0, .32), 0 7px 18px rgba(255, 90, 185, .13);
}

.breadcrumb-ticker::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: .7;
  background: linear-gradient(105deg, transparent 8%, rgba(255,255,255,.06) 24%, transparent 39%), radial-gradient(circle at 22% 50%, rgba(255, 138, 0, .12), transparent 24rem), radial-gradient(circle at 76% 50%, rgba(49, 230, 255, .1), transparent 22rem);
}

.breadcrumb-ticker__rail {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 1140px;
  min-height: 3.25rem;
  margin: 0 auto;
  padding: .66rem 1rem;
}

.breadcrumb-ticker__list {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  width: 100%;
  margin: 0;
  padding: 0;
  list-style: none;
  font-family: var(--heading-font);
  font-size: 1rem;
  font-weight: 850;
  line-height: 1.2;
  letter-spacing: .075em;
  text-align: center;
  text-transform: uppercase;
}

.breadcrumb-ticker__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  min-width: 0;
}

.breadcrumb-ticker__item + .breadcrumb-ticker__item::before {
  content: "›";
  color: #ffe45e;
  -webkit-text-fill-color: #ffe45e;
  text-shadow: 0 0 7px rgba(255, 228, 94, .9), 0 0 14px rgba(255, 90, 185, .5);
}

.breadcrumb-ticker a,
.breadcrumb-ticker [aria-current="page"] {
  color: #fff2d2;
  background: linear-gradient(180deg, #ffffff 0%, #fff3c4 28%, #ffc04f 52%, #ff596f 75%, #ff92d7 100%);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 6px rgba(255, 138, 0, .55), 0 0 13px rgba(255, 90, 185, .38);
}

.breadcrumb-ticker a { text-decoration: none; }
.breadcrumb-ticker a:hover,
.breadcrumb-ticker a:focus-visible {
  filter: brightness(1.22) saturate(1.1);
  text-shadow: 0 0 7px rgba(255, 255, 255, .8), 0 0 16px rgba(49, 230, 255, .72), 0 0 22px rgba(255, 90, 185, .46);
}

@media (max-width: 575.98px) {
  .breadcrumb-ticker,
  .breadcrumb-ticker__rail { min-height: 3rem; }
  .breadcrumb-ticker__rail { padding: .58rem .75rem; }
  .breadcrumb-ticker__list { font-size: .95rem; letter-spacing: .055em; }
}
/* END shared body breadcrumb ribbon */
'''
          body_path.write_text(body_css + breadcrumb_css, encoding="utf-8")

          guide_path = Path("js/site-guide.js")
          guide_js = guide_path.read_text(encoding="utf-8")
          guide_js = re.sub(r'const sharedRevision = scriptUrl\.searchParams\.get\("v"\) \|\| "shared-ui-[^"]+";', f'const sharedRevision = scriptUrl.searchParams.get("v") || "{release}";', guide_js)
          guide_path.write_text(guide_js, encoding="utf-8")

          for page in Path(".").glob("*.html"):
              html = page.read_text(encoding="utf-8")
              html = re.sub(r'css/site\.css(?:\?[^"\']*)?', f'css/site.css?v={release}', html)
              html = re.sub(r'shared-ui-[0-9]+', release, html)
              page.write_text(html, encoding="utf-8")
          PY

      - name: Commit restored breadcrumb
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/site.css css/site-led-matrix.css js/site-led-matrix.js js/site-guide.js '*.html'
          git commit -m "Restore centered text breadcrumb ribbon" || true

      - name: Remove one-time workflow
        shell: bash
        run: |
          git rm .github/workflows/restore-text-breadcrumb-once.yml
          git commit -m "Remove one-time breadcrumb restoration workflow"
          git push

# trigger
name: Normalize static navigation

on:
  push:
    paths:
      - '.github/workflows/normalize-static-navigation.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use identical navigation markup on every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'<div class="navbar-nav ms-auto">.*?</div>', re.S)

          for path in sorted(Path('.').glob('*.html')):
              html = path.read_text(encoding='utf-8')
              if not pattern.search(html):
                  continue

              page = path.name
              bike = page == 'build-my-bike.html'
              home = page == 'build-my-home.html'
              catalog = page == 'led-catalog.html'
              about = page == 'aboutme.html'
              contact = page == 'contact.html'

              build_class = ' active' if bike or home else ''
              bike_class = ' active' if bike else ''
              home_class = ' active' if home else ''
              catalog_class = ' active' if catalog else ''
              about_class = ' active' if about else ''
              contact_class = ' active' if contact else ''
              bike_current = ' aria-current="page"' if bike else ''
              home_current = ' aria-current="page"' if home else ''
              catalog_current = ' aria-current="page"' if catalog else ''
              about_current = ' aria-current="page"' if about else ''
              contact_current = ' aria-current="page"' if contact else ''

              nav = f'''<div class="navbar-nav ms-auto">
          <div class="nav-item dropdown shynetyme-build-menu" data-shynetyme-build-menu="true">
            <button class="nav-link dropdown-toggle{build_class}" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Open Build menu">Build</button>
            <ul class="dropdown-menu dropdown-menu-dark" aria-label="Build pages">
              <li><a class="dropdown-item{bike_class}"{bike_current} href="build-my-bike.html">Bike Builder</a></li>
              <li><a class="dropdown-item{home_class}"{home_current} href="build-my-home.html">Home Builder</a></li>
            </ul>
          </div>
          <a class="nav-link{catalog_class}"{catalog_current} href="led-catalog.html">LED Catalog</a>
          <a class="nav-link{about_class}"{about_current} href="aboutme.html">About Deke</a>
          <a class="nav-link{contact_class}"{contact_current} href="contact.html">Request Install</a>
        </div>'''

              path.write_text(pattern.sub(nav, html, count=1), encoding='utf-8')
          PY
      - name: Commit navigation normalization
        run: |
          rm .github/workflows/normalize-static-navigation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use one shared navigation structure on every page'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            sleep 3
          done
          exit 1

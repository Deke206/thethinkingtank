name: Consolidate split CSS files once

on:
  push:
    paths:
      - '.github/workflows/consolidate-css-once.yml'

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consolidate obvious split CSS files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []

          def write_if_changed(path, text):
              old = path.read_text(encoding='utf-8') if path.exists() else None
              if old != text:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          # 1) Build My Bike: fold the upgrade override CSS into the owning stylesheet.
          bike_css = Path('css/bike-builder.css')
          bike_upgrade = Path('css/bike-builder-upgrade.css')
          if bike_css.exists() and bike_upgrade.exists():
              base = bike_css.read_text(encoding='utf-8').rstrip()
              upgrade = bike_upgrade.read_text(encoding='utf-8').strip()
              marker = '/* Consolidated live-view upgrade rules from former css/bike-builder-upgrade.css. */'
              if marker not in base:
                  merged = f"{base}\n\n{marker}\n{upgrade}\n"
                  write_if_changed(bike_css, merged)
              bike_upgrade.unlink()
              changed.append(str(bike_upgrade) + ' deleted')

          # Stop the bike builder live-view module from injecting the deleted upgrade CSS.
          liveview = Path('js/bike-builder-liveview.js')
          if liveview.exists():
              text = liveview.read_text(encoding='utf-8')
              original = text
              text = re.sub(
                  r'\n\s*const addStyles = \(\) => \{.*?\n\s*\};\n',
                  '\n',
                  text,
                  flags=re.S,
              )
              text = text.replace('\n  addStyles();\n', '\n')
              if text != original:
                  write_if_changed(liveview, text)

          # 2) Chuck: fold base + refinements into the canonical site-chuck stylesheet.
          site_chuck = Path('css/site-chuck.css')
          chuck_base = Path('css/site-chuck-base.css')
          chuck_refinements = Path('css/site-chuck-refinements.css')
          if site_chuck.exists() and chuck_base.exists() and chuck_refinements.exists():
              base = chuck_base.read_text(encoding='utf-8').strip()
              refinements = chuck_refinements.read_text(encoding='utf-8').strip()
              merged = '/* Canonical site-wide Chuck stylesheet. */\n\n' + base + '\n\n' + refinements + '\n'
              write_if_changed(site_chuck, merged)
              chuck_base.unlink()
              chuck_refinements.unlink()
              changed.extend([str(chuck_base) + ' deleted', str(chuck_refinements) + ' deleted'])

          # Remove any stale references to deleted CSS filenames if they exist in checked-in source.
          for path in Path('.').rglob('*'):
              if path.is_dir() or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.js', '.css'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = text
              text = text.replace('@import url("./site-chuck-base.css");\n', '')
              text = text.replace('@import url("./site-chuck-refinements.css");\n', '')
              text = text.replace('@import url(\'./site-chuck-base.css\');\n', '')
              text = text.replace('@import url(\'./site-chuck-refinements.css\');\n', '')
              if text != original:
                  write_if_changed(path, text)

          print('Changed:')
          for item in changed:
              print('-', item)
          PY

      - name: Commit consolidation
        run: |
          rm .github/workflows/consolidate-css-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Consolidate split CSS files into owning stylesheets'
          git push

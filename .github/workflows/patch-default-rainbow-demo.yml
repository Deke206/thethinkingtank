name: Patch default rainbow SIM demo

on:
  push:
    branches:
      - agent/sim-default-rainbow-demo-v3
    paths:
      - .github/workflows/patch-default-rainbow-demo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sim-default-rainbow-demo-v3
          fetch-depth: 0
      - name: Apply default rainbow demo
        run: python scripts/patch-default-rainbow-demo.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          grep -q 'function defaultRainbowDemoRecipe' js/sim-node-sequence.js
          grep -q 'effect: "rainbow"' js/sim-node-sequence.js
          grep -q 'area.active = true' js/sim-node-sequence.js
          grep -q 'area.selected = false' js/sim-node-sequence.js
          grep -q 'simulator === "home"' js/sim-node-sequence.js
          git diff --check
      - name: Commit validated default demo
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-default-rainbow-demo.py .github/workflows/patch-default-rainbow-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Start SIM pages with base rainbow demo"
          git push origin HEAD:agent/sim-default-rainbow-demo-v3

name: Inspect Auto SIM page structure
on:
  push:
    branches: [agent/fix-auto-page-theme]
    paths: [.github/workflows/inspect-auto-page-structure.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-auto-page-theme
      - name: Decode and inspect relevant Auto SIM markup
        shell: bash
        run: |
          set -euo pipefail
          cat assets/sim-auto/car-base-{1,2,3,4,5,6}.txt | tr -d '\n\r' | base64 -d > /tmp/auto.html
          python - <<'PY'
          from pathlib import Path
          html = Path('/tmp/auto.html').read_text(encoding='utf-8')
          for needle in ['site.css', 'site-banner', 'Breadcrumb', 'Live aligned preview', 'stage-head', 'auto-card', 'center']:
              print(f'\n===== {needle} =====')
              pos = html.lower().find(needle.lower())
              if pos < 0:
                  print('NOT FOUND')
                  continue
              start = max(0, pos-1000)
              end = min(len(html), pos+1800)
              print(html[start:end])
          PY

# Merge-triggered one-time cleanup.
name: Clean shared page subheader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-page-subheader-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-subheader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove old breadcrumb matrix code and simplify shared styling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          release = "shared-ui-3"

          # The LED matrix engine owns only the hero matrix ribbons.
          matrix_path = Path("js/site-led-matrix.js")
          matrix = matrix_path.read_text(encoding="utf-8")
          matrix = re.sub(
              r"\n  function collectBreadcrumbText\(ticker\) \{.*?\n  \}\n",
              "\n",
              matrix,
              count=1,
              flags=re.S,
          )
          matrix = re.sub(
              r"\n  function transformBreadcrumb\(usedEffects, usedPalettes\) \{.*?\n  \}\n",
              "\n",
              matrix,
              count=1,
              flags=re.S,
          )
          matrix = matrix.replace("    transformBreadcrumb(usedEffects, usedPalettes);\n", "")
          matrix_path.write_text(matrix, encoding="utf-8")

          # Navigation CSS owns navigation only. Remove the temporary breadcrumb patch block.
          navigation_path = Path("css/site-navigation.css")
          navigation = navigation_path.read_text(encoding="utf-8")
          start = navigation.find("/* Shared body breadcrumb ribbon:")
          if start != -1:
              end = navigation.find("@media (prefers-reduced-motion: reduce)", start)
              if end == -1:
                  raise RuntimeError("Could not locate the end of the temporary breadcrumb block")
              navigation = navigation[:start].rstrip() + "\n\n" + navigation[end:]
          navigation_path.write_text(navigation, encoding="utf-8")

          # One concise, canonical page-subheader system in the base site stylesheet.
          site_path = Path("css/site.css")
          site = site_path.read_text(encoding="utf-8")
          marker = "/* Shared page subheader: one centered row with one animated bottom rule. */"
          if marker in site:
              site = site[:site.index(marker)].rstrip() + "\n"

          site += r'''

/* Shared page subheader: one centered row with one animated bottom rule. */
#page-subheader {
  position: relative;
  display: grid;
  min-height: 3.15rem;
  place-items: center;
  overflow: hidden;
  background: linear-gradient(90deg, #020611, #0b1c3a 50%, #120b2a, #020611);
}

#page-subheader::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--coral), #ff8a00, var(--amber), var(--pink), var(--violet), var(--cyan), var(--coral));
  background-size: 300% 100%;
  animation: hero-led-border-flow 4.4s linear infinite;
}

#page-subheader-row {
  display: flex;
  width: min(100%, 1140px);
  min-height: 3.15rem;
  align-items: center;
  justify-content: center;
  padding: .65rem 1rem .75rem;
}

#page-subheader-text {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  margin: 0;
  padding: 0;
  list-style: none;
  font-family: var(--heading-font);
  font-size: clamp(1rem, 1.2vw, 1.125rem);
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: .07em;
  text-align: center;
  text-transform: uppercase;
}

#page-subheader-text .breadcrumb-ticker__item {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
}

#page-subheader-text .breadcrumb-ticker__item + .breadcrumb-ticker__item::before {
  content: "›";
  color: var(--amber);
  text-shadow: 0 0 8px rgba(255, 197, 98, .7);
}

#page-subheader-text a,
#page-subheader-text [aria-current="page"] {
  color: #fff3d2;
  background: linear-gradient(180deg, #fff, #fff2bd 34%, #ffc562 58%, #ff7c82 78%, #ff9bd2);
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 7px rgba(255, 138, 0, .38), 0 0 13px rgba(255, 90, 185, .28);
}

#page-subheader-text a { text-decoration: none; }
#page-subheader-text a:hover,
#page-subheader-text a:focus-visible { filter: brightness(1.2); }

@media (max-width: 575.98px) {
  #page-subheader,
  #page-subheader-row { min-height: 3rem; }
  #page-subheader-row { padding: .58rem .75rem .68rem; }
  #page-subheader-text { font-size: .95rem; letter-spacing: .045em; }
}

@media (prefers-reduced-motion: reduce) {
  #page-subheader::after { animation: none; }
}
'''
          site_path.write_text(site, encoding="utf-8")

          # Every public page uses the same explicit IDs and one shared release revision.
          pages = [
              Path("index.html"),
              Path("aboutme.html"),
              Path("build-my-bike.html"),
              Path("build-my-home.html"),
              Path("contact.html"),
              Path("led-banner-magic.html"),
              Path("led-catalog.html"),
          ]

          for page in pages:
              text = page.read_text(encoding="utf-8")
              text = text.replace(
                  '<nav class="breadcrumb-ticker"',
                  '<nav id="page-subheader" class="breadcrumb-ticker"',
              )
              text = text.replace(
                  '<nav id="page-subheader" id="page-subheader"',
                  '<nav id="page-subheader"',
              )
              text = text.replace(
                  '<div class="breadcrumb-ticker__rail">',
                  '<div id="page-subheader-row" class="breadcrumb-ticker__rail">',
              )
              text = text.replace(
                  '<div id="page-subheader-row" id="page-subheader-row"',
                  '<div id="page-subheader-row"',
              )
              text = text.replace(
                  '<ol class="breadcrumb-ticker__list">',
                  '<ol id="page-subheader-text" class="breadcrumb-ticker__list">',
              )
              text = text.replace(
                  '<ol id="page-subheader-text" id="page-subheader-text"',
                  '<ol id="page-subheader-text"',
              )
              text = re.sub(r'css/site\.css(?:\?[^"\']*)?', f'css/site.css?v={release}', text)
              text = re.sub(r'js/site-guide\.js(?:\?[^"\']*)?', f'js/site-guide.js?v={release}', text)
              text = re.sub(r'((?:css/site-(?:navigation|hero|led-matrix|chuck|motion)\.css)\?v=)shared-ui-\d+', rf'\g<1>{release}', text)
              page.write_text(text, encoding="utf-8")

          # Keep the shared loader's default revision aligned with the pages.
          guide_path = Path("js/site-guide.js")
          guide = guide_path.read_text(encoding="utf-8")
          guide = re.sub(r'const sharedRevision = scriptUrl\.searchParams\.get\("v"\) \|\| "[^"]+";',
                         f'const sharedRevision = scriptUrl.searchParams.get("v") || "{release}";', guide)
          guide_path.write_text(guide, encoding="utf-8")

          # Fail rather than leave half-cleaned code.
          checks = {
              "breadcrumb matrix renderer": "transformBreadcrumb" not in matrix,
              "breadcrumb matrix text collector": "collectBreadcrumbText" not in matrix,
              "temporary navigation patch": "Shared body breadcrumb ribbon" not in navigation,
              "canonical base subheader": marker in site,
          }
          failed = [name for name, passed in checks.items() if not passed]
          if failed:
              raise RuntimeError("Cleanup checks failed: " + ", ".join(failed))

          for page in pages:
              text = page.read_text(encoding="utf-8")
              for required_id in ('id="page-subheader"', 'id="page-subheader-row"', 'id="page-subheader-text"'):
                  if required_id not in text:
                      raise RuntimeError(f"{page}: missing {required_id}")
          PY

      - name: Commit cleaned shared subheader
        shell: bash
        run: |
          rm -f .github/workflows/clean-page-subheader-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/site.css css/site-navigation.css js/site-led-matrix.js js/site-guide.js *.html .github/workflows/clean-page-subheader-once.yml
          git commit -m "Clean and centralize shared page subheader"
          git push

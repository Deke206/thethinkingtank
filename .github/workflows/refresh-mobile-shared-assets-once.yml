name: Refresh mobile shared assets once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-mobile-shared-assets-once.yml"

permissions:
  contents: write

jobs:
  refresh-mobile-assets:
    if: ${{ github.event.head_commit.message != 'Refresh shared mobile asset loading' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize shared asset revision and direct simulator motion loading
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          revision = "shared-ui-1"

          guide_path = Path("js/site-guide.js")
          guide = guide_path.read_text()

          guide = guide.replace(
              '  const siteRoot = new URL("../", scriptUrl);\n',
              '  const siteRoot = new URL("../", scriptUrl);\n'
              '  const sharedRevision = scriptUrl.searchParams.get("v") || "shared-ui-1";\n'
              '  const withRevision = (path) => {\n'
              '    const url = new URL(path, siteRoot);\n'
              '    url.searchParams.set("v", sharedRevision);\n'
              '    return url.href;\n'
              '  };\n'
          )

          guide = re.sub(r'"(css|js)/([^"?]+)\?v=[^"]+"', r'"\1/\2"', guide)
          guide = guide.replace('    const href = new URL(path, siteRoot).href;', '    const href = withRevision(path);')
          guide = guide.replace('    script.src = new URL(path, siteRoot).href;', '    script.src = withRevision(path);')
          guide_path.write_text(guide)

          shared_css = ("site-navigation", "site-hero", "site-led-matrix", "site-chuck")
          for path in Path(".").glob("*.html"):
              html = path.read_text()
              html = re.sub(
                  r'src="js/site-guide\.js(?:\?[^\"]*)?"',
                  f'src="js/site-guide.js?v={revision}"',
                  html
              )
              for name in shared_css:
                  html = re.sub(
                      rf'href="css/{name}\.css(?:\?[^\"]*)?"',
                      f'href="css/{name}.css?v={revision}"',
                      html
                  )

              if path.name in {"build-my-bike.html", "build-my-home.html"} and 'data-shynetyme-motion="true"' not in html:
                  marker = re.search(r'^(\s*)<link rel="stylesheet" href="css/site-chuck\.css\?v=[^\"]+" data-shynetyme-site-chuck="true">$', html, re.M)
                  if marker:
                      indent = marker.group(1)
                      motion = f'{indent}<link rel="stylesheet" href="css/site-motion.css?v={revision}" data-shynetyme-motion="true">'
                      html = html[:marker.end()] + "\n" + motion + html[marker.end():]

              path.write_text(html)
          PY
          node --check js/site-guide.js
          grep -q 'site-motion.css?v=shared-ui-1' build-my-bike.html
          grep -q 'site-motion.css?v=shared-ui-1' build-my-home.html
          grep -q 'site-guide.js?v=shared-ui-1' build-my-bike.html
          grep -q 'site-guide.js?v=shared-ui-1' build-my-home.html
      - name: Remove one-time workflow
        run: rm .github/workflows/refresh-mobile-shared-assets-once.yml
      - name: Commit refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' js/site-guide.js .github/workflows/refresh-mobile-shared-assets-once.yml
          git commit -m "Refresh shared mobile asset loading"
          git push

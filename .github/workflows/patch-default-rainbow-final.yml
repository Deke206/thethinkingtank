name: Patch final default rainbow
# validation retry after current Base rainbow editor inspection

on:
  push:
    branches:
      - agent/default-rainbow-final
    paths:
      - .github/workflows/patch-default-rainbow-final.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/default-rainbow-final
          fetch-depth: 0
      - name: Apply final default Rainbow behavior
        run: python scripts/patch-default-rainbow-final.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          grep -q 'function applyDefaultRainbow' js/sim-node-sequence.js
          grep -q 'Default rainbow' js/sim-node-sequence.js
          grep -q 'if (stored?.version !== 3' js/sim-node-sequence.js
          grep -q 'element.classList.remove("zone-on", "zone-off")' js/sim-node-sequence.js
          grep -q 'fill: none !important' css/sim-node-sequence.css
          grep -q 'isBaseRainbow' js/sim-node-sequence.js
          ! grep -q '{ id: "rainbow", label: "Rainbow"' js/sim-node-sequence.js
          git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-default-rainbow-final.py .github/workflows/patch-default-rainbow-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make base rainbow the neutral SIM default"
          git push origin HEAD:agent/default-rainbow-final

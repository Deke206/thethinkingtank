name: Refresh shared navigation asset revision

on:
  push:
    branches:
      - agent/bust-shared-nav-cache
    paths:
      - .github/workflows/bust-shared-nav-cache.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bust-shared-nav-cache
          fetch-depth: 0

      - name: Bump shared UI revision on root pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          pattern = re.compile(r'assets/js/site-guide\.js\?v=shared-ui-[A-Za-z0-9._-]+')
          replacement = 'assets/js/site-guide.js?v=shared-ui-15'

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              updated, count = pattern.subn(replacement, text)
              if count:
                  path.write_text(updated, encoding='utf-8')
                  changed.append((path.as_posix(), count))

          if not changed:
              raise SystemExit('No root HTML site-guide revision references were found.')

          print('Updated shared navigation revision references:')
          for path, count in changed:
              print(f'  {path}: {count}')
          PY

      - name: Validate page references and root navigation
        shell: bash
        run: |
          set -euo pipefail
          test -f ledbikesim.html
          test -f ledautosim.html
          test -f ledhomesim.html
          test -f assets/js/site-guide.js
          test -f assets/js/site-chuck.js

          if grep -RInE 'assets/(ledbike|ledauto|ledhome)sim\.html' --include='*.html' --include='*.js' .; then
            echo 'Bad /assets/ simulator page reference remains.' >&2
            exit 1
          fi

          grep -Fq 'const siteRoot = new URL("../../", scriptUrl);' assets/js/site-guide.js
          grep -Fq 'const siteRoot = new URL("../../", scriptUrl);' assets/js/site-chuck.js

          for page in *.html; do
            if grep -q 'assets/js/site-guide.js?v=' "$page"; then
              grep -q 'assets/js/site-guide.js?v=shared-ui-15' "$page"
            fi
          done

          node --check assets/js/site-guide.js
          node --check assets/js/site-chuck.js

      - name: Commit verified cache refresh
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bust-shared-nav-cache.yml
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.' >&2
            exit 1
          fi
          git config user.name 'Deke310'
          git config user.email '135410011+Deke206@users.noreply.github.com'
          git commit -m 'fix: refresh shared navigation asset revision'
          git push origin HEAD:agent/bust-shared-nav-cache

name: Patch default rainbow state

on:
  push:
    branches:
      - agent/default-rainbow-clean-effects
    paths:
      - .github/workflows/patch-default-rainbow-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/default-rainbow-clean-effects
          fetch-depth: 0
      - name: Apply default rainbow and overlay cleanup
        run: python scripts/patch-default-rainbow-state.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          grep -q 'function applyDefaultRainbow' js/sim-node-sequence.js
          grep -q 'Default rainbow' js/sim-node-sequence.js
          grep -q 'if (stored?.version !== 3' js/sim-node-sequence.js
          grep -q 'fill: none !important' css/sim-node-sequence.css
          grep -q 'element.classList.remove("zone-on", "zone-off")' js/sim-node-sequence.js
          grep -q 'colors: \[...RAINBOW_COLORS\]' js/sim-node-sequence.js
          git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-default-rainbow-state.py .github/workflows/patch-default-rainbow-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use default rainbow without custom-effect overlay"
          git push origin HEAD:agent/default-rainbow-clean-effects

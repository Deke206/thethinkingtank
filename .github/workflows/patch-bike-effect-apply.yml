name: Patch Bike SIM effect apply
on:
  push:
    branches:
      - agent/fix-bike-effect-apply-rainbow
    paths:
      - .github/workflows/patch-bike-effect-apply.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-bike-effect-apply-rainbow
      - name: Patch shared simulator behavior
        shell: python
        run: |
          from pathlib import Path
          p = Path('js/sim-node-sequence.js')
          s = p.read_text()
          def once(old, new):
              global s
              if old not in s:
                  raise SystemExit('Missing JS patch anchor: ' + old[:120])
              s = s.replace(old, new, 1)

          once('const ASSIGNMENT_KEY = `shynetymeAreaAssignmentsV1:${simulator}`;', 'const ASSIGNMENT_KEY = `shynetymeAreaAssignmentsV2:${simulator}`;')
          once('const DEFAULT_STEP_SECONDS = 4;\n', '''const DEFAULT_STEP_SECONDS = 4;\n  const RAINBOW_COLORS = Object.freeze([\n    "#ff004c", "#ff9500", "#ffe100", "#00d084",\n    "#00c8ff", "#3b82f6", "#6f42c1"\n  ]);\n  const GRADIENT_LENGTHS = Object.freeze([\n    ["quarter", "Quarter of the LEDs", "25%"],\n    ["half", "Half of the LEDs", "50%"],\n    ["three-quarter", "Three-quarters of the LEDs", "75%"],\n    ["whole", "Whole LED run", "100%"]\n  ]);\n''')
          once('effect: "solid",\n      section: "whole",\n      paletteMode:', 'effect: "solid",\n      section: "whole",\n      gradientLength: "whole",\n      paletteMode:')
          once('section: SECTIONS.some(([id]) => id === recipe?.section) ? recipe.section : "whole",\n      paletteMode:', 'section: SECTIONS.some(([id]) => id === recipe?.section) ? recipe.section : "whole",\n      gradientLength: GRADIENT_LENGTHS.some(([id]) => id === recipe?.gradientLength) ? recipe.gradientLength : "whole",\n      paletteMode:')
          once('function normalizedColors(recipe) {\n    const colors = [...recipe.colors];', 'function normalizedColors(recipe) {\n    if (recipe.effect === "rainbow") return [RAINBOW_COLORS[0], RAINBOW_COLORS[3], RAINBOW_COLORS[6]];\n    const colors = [...recipe.colors];')
          once('if (stored?.version !== 1 || stored.simulator !== simulator) return;', 'if (stored?.version !== 2 || stored.simulator !== simulator) return;')
          once('version: 1,\n        simulator,', 'version: 2,\n        simulator,')
          once('delete element.dataset.simSection;\n      element.classList.remove', 'delete element.dataset.simSection;\n      delete element.dataset.simPalette;\n      delete element.dataset.simGradientLength;\n      element.classList.remove')
          once('["--sim-a", "--sim-b", "--sim-c", "--sim-brightness", "--sim-speed", "--sim-direction"]', '["--sim-a", "--sim-b", "--sim-c", "--sim-brightness", "--sim-speed", "--sim-direction", "--sim-gradient-stroke"]')
          once('function applyDomArea(area, sourceRecipe) {', '''function ensureSvgGradient(element, recipe, colors) {\n    const svg = element.closest?.("svg");\n    if (!svg || recipe.paletteMode !== "gradient") {\n      element.style.removeProperty("--sim-gradient-stroke");\n      return;\n    }\n    let defs = svg.querySelector("defs[data-sim-area-gradients]");\n    if (!defs) {\n      defs = document.createElementNS("http://www.w3.org/2000/svg", "defs");\n      defs.dataset.simAreaGradients = "true";\n      svg.prepend(defs);\n    }\n    const gradientId = `sim-area-gradient-${areaSafeId(element.dataset.simGradientOwner || "shared")}`;\n    let gradient = defs.querySelector(`#${gradientId}`);\n    if (!gradient) {\n      gradient = document.createElementNS("http://www.w3.org/2000/svg", "linearGradient");\n      gradient.id = gradientId;\n      gradient.setAttribute("x1", "0%");\n      gradient.setAttribute("y1", "0%");\n      gradient.setAttribute("y2", "0%");\n      gradient.setAttribute("spreadMethod", "repeat");\n      defs.append(gradient);\n    }\n    const length = GRADIENT_LENGTHS.find(([id]) => id === recipe.gradientLength)?.[2] || "100%";\n    gradient.setAttribute("x2", length);\n    gradient.replaceChildren();\n    const stops = recipe.effect === "rainbow"\n      ? RAINBOW_COLORS.map((color, index) => [index / (RAINBOW_COLORS.length - 1), color])\n      : [[0, colors[0]], [0.5, colors[1]], [1, colors[2]]];\n    stops.forEach(([offset, color]) => {\n      const stop = document.createElementNS("http://www.w3.org/2000/svg", "stop");\n      stop.setAttribute("offset", `${Math.round(offset * 100)}%`);\n      stop.setAttribute("stop-color", color);\n      gradient.append(stop);\n    });\n    element.style.setProperty("--sim-gradient-stroke", `url(#${gradientId})`);\n  }\n\n  function areaSafeId(value) {\n    return String(value || "area").replace(/[^a-z0-9_-]/gi, "-");\n  }\n\n  function applyDomArea(area, sourceRecipe) {''')
          once('element.dataset.simSection = recipe.section;\n      element.classList.add', 'element.dataset.simSection = recipe.section;\n      element.dataset.simPalette = recipe.paletteMode;\n      element.dataset.simGradientLength = recipe.gradientLength;\n      element.dataset.simGradientOwner = area.id;\n      ensureSvgGradient(element, recipe, colors);\n      element.classList.add')
          once('function sectionOptions(selectedId) {\n    return SECTIONS.map(([id, label]) => `<option value="${id}"${id === selectedId ? " selected" : ""}>${safeText(label)}</option>`).join("");\n  }', '''function sectionOptions(selectedId) {\n    return SECTIONS.map(([id, label]) => `<option value="${id}"${id === selectedId ? " selected" : ""}>${safeText(label)}</option>`).join("");\n  }\n\n  function gradientLengthOptions(selectedId) {\n    return GRADIENT_LENGTHS.map(([id, label]) => `<option value="${id}"${id === selectedId ? " selected" : ""}>${safeText(label)}</option>`).join("");\n  }''')
          once('<button type="button" data-workbench-action="clear-selection">Clear selection</button>', '<button type="button" data-workbench-action="clear-selection">Unselect areas</button>')
          once('<label class="sim-field">Color use\n            <select id="simPaletteMode">', '<label class="sim-field" id="simPaletteModeWrap"${editorRecipe.effect === "rainbow" ? " hidden" : ""}>Color use\n            <select id="simPaletteMode">')
          once('</select>\n          </label>\n          <label class="sim-field sim-color-field">Primary', '''</select>\n          </label>\n          <label class="sim-field" id="simGradientLengthWrap"${editorRecipe.paletteMode === "gradient" ? "" : " hidden"}>Gradient length\n            <select id="simGradientLength">${gradientLengthOptions(editorRecipe.gradientLength)}</select>\n          </label>\n          <label class="sim-field sim-color-field" id="simColor1Wrap"${editorRecipe.effect === "rainbow" ? " hidden" : ""}>Primary''')
          once('data-color-wrap="2"${editorRecipe.paletteMode === "single" ? " hidden" : ""}', 'data-color-wrap="2"${editorRecipe.paletteMode === "single" || editorRecipe.effect === "rainbow" ? " hidden" : ""}')
          once('data-color-wrap="3"${editorRecipe.paletteMode !== "gradient" ? " hidden" : ""}', 'data-color-wrap="3"${editorRecipe.paletteMode !== "gradient" || editorRecipe.effect === "rainbow" ? " hidden" : ""}')
          once('id="simSpeedWrap"${effect.speed ? "" : " hidden"}', 'id="simSpeedWrap"${effect.speed && effect.id !== "rainbow" ? "" : " hidden"}')
          once('id="simDirectionWrap"${effect.directional ? "" : " hidden"}', 'id="simDirectionWrap"${effect.directional && effect.id !== "rainbow" ? "" : " hidden"}')
          preview = '''          <div class="sim-effect-preview" id="simEffectPreview" style="--preview-a:${editorRecipe.colors[0]};--preview-b:${editorRecipe.colors[1]};--preview-c:${editorRecipe.colors[2]}">\n            <span>${safeText(effect.label)}</span>\n          </div>\n'''
          once(preview, '')
          once('section: root.querySelector("#simEffectSection")?.value,\n      paletteMode:', 'section: root.querySelector("#simEffectSection")?.value,\n      gradientLength: root.querySelector("#simGradientLength")?.value || editorRecipe.gradientLength,\n      paletteMode:')
          once('const directionWrap = root.querySelector("#simDirectionWrap");\n    const color2Wrap', 'const directionWrap = root.querySelector("#simDirectionWrap");\n    const paletteWrap = root.querySelector("#simPaletteModeWrap");\n    const gradientLengthWrap = root.querySelector("#simGradientLengthWrap");\n    const color1Wrap = root.querySelector("#simColor1Wrap");\n    const color2Wrap')
          once('if (speedWrap) speedWrap.hidden = !effect.speed;\n    if (directionWrap) directionWrap.hidden = !effect.directional;\n    if (color2Wrap) color2Wrap.hidden = editorRecipe.paletteMode === "single";\n    if (color3Wrap) color3Wrap.hidden = editorRecipe.paletteMode !== "gradient";', '''const isRainbow = effect.id === "rainbow";\n    if (isRainbow) {\n      editorRecipe.paletteMode = "gradient";\n      editorRecipe.colors = [RAINBOW_COLORS[0], RAINBOW_COLORS[3], RAINBOW_COLORS[6]];\n    }\n    if (speedWrap) speedWrap.hidden = !effect.speed || isRainbow;\n    if (directionWrap) directionWrap.hidden = !effect.directional || isRainbow;\n    if (paletteWrap) paletteWrap.hidden = isRainbow;\n    if (gradientLengthWrap) gradientLengthWrap.hidden = editorRecipe.paletteMode !== "gradient";\n    if (color1Wrap) color1Wrap.hidden = isRainbow;\n    if (color2Wrap) color2Wrap.hidden = editorRecipe.paletteMode === "single" || isRainbow;\n    if (color3Wrap) color3Wrap.hidden = editorRecipe.paletteMode !== "gradient" || isRainbow;''')
          once('["simEffectType", "simEffectSection", "simPaletteMode", "simDirection"]', '["simEffectType", "simEffectSection", "simGradientLength", "simPaletteMode", "simDirection"]')
          once('function initialize() {\n    loadState();\n    preparePage();\n    areas.forEach((area) => {', '''function initialize() {\n    loadState();\n    preparePage();\n    areas.forEach((area) => {\n      if (!area.active) {\n        if (simulator === "home") clearHomeArea(area);\n        else clearDomArea(area);\n      }\n    });\n    if (simulator === "home") {\n      window.setTimeout(() => {\n        areas.forEach((area) => { if (!area.active) clearHomeArea(area); });\n      }, 350);\n    }\n    areas.forEach((area) => {''')
          p.write_text(s)

          c = Path('css/sim-node-sequence.css')
          css = c.read_text()
          css += '''\n\n/* Bike SIM compact Step 1 buttons and gradient/rainbow corrections. */\n.sim-area-bike .sim-area-grid {\n  grid-template-columns: repeat(auto-fit, 112px);\n  justify-content: center;\n  gap: .42rem;\n}\n.sim-area-bike .sim-area-button {\n  width: 112px;\n  height: 86px;\n  aspect-ratio: auto;\n  padding: .48rem;\n}\n.sim-area-bike .sim-area-button strong { font-size: .68rem; }\n.sim-area-bike .sim-area-button small { font-size: .5rem; }\n.sim-area-bike .sim-area-button em { font-size: .53rem; }\n.sim-effect-preview { display: none !important; }\n[data-sim-area-active="true"][data-sim-palette="gradient"] {\n  stroke: var(--sim-gradient-stroke, var(--sim-a, #35e7ff)) !important;\n}\n[data-sim-area-active="true"][data-sim-effect="rainbow"] {\n  animation-name: sim-area-rainbow-shift !important;\n  stroke: var(--sim-gradient-stroke, var(--sim-a, #35e7ff)) !important;\n  stroke-dasharray: none !important;\n}\n@keyframes sim-area-rainbow-shift {\n  from { stroke-dashoffset: 0; }\n  to { stroke-dashoffset: -96; }\n}\n@media (max-width: 760px) {\n  .sim-area-bike .sim-area-grid { grid-template-columns: repeat(auto-fit, 102px); }\n  .sim-area-bike .sim-area-button { width: 102px; height: 80px; }\n}\n@media (max-width: 430px) {\n  .sim-area-bike .sim-area-grid { grid-template-columns: repeat(auto-fit, 94px); }\n  .sim-area-bike .sim-area-button { width: 94px; height: 76px; }\n}\n'''
          c.write_text(css)
      - name: Validate patch
        shell: bash
        run: |
          node --check js/sim-node-sequence.js
          grep -q 'shynetymeAreaAssignmentsV2' js/sim-node-sequence.js
          grep -q 'Gradient length' js/sim-node-sequence.js
          grep -q 'RAINBOW_COLORS' js/sim-node-sequence.js
          grep -q 'sim-area-rainbow-shift' css/sim-node-sequence.css
          grep -q 'width: 112px' css/sim-node-sequence.css
          ! grep -q '<div class="sim-effect-preview"' js/sim-node-sequence.js
      - name: Commit patch
        shell: bash
        run: |
          rm .github/workflows/patch-bike-effect-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/sim-node-sequence.js css/sim-node-sequence.css .github/workflows/patch-bike-effect-apply.yml
          git commit -m "Fix Bike SIM apply state and rainbow gradient"
          git push origin HEAD:agent/fix-bike-effect-apply-rainbow

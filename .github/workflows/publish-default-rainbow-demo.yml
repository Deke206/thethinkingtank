name: Publish default rainbow SIM demo

on:
  push:
    branches:
      - agent/sim-default-rainbow-demo-v3
    paths:
      - .github/workflows/publish-default-rainbow-demo.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/sim-default-rainbow-demo-v3
          fetch-depth: 0
      - name: Verify branch is based on current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "d7d6103463245c566a0ff799e3f2d0f3aba81f44"
          node --check js/sim-node-sequence.js
      - name: Squash validated branch onto main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/publish-default-rainbow-demo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git reset --soft origin/main
          git add -A
          git commit -m "Start SIM pages with base rainbow demo"
          git push origin HEAD:main

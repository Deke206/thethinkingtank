name: Patch Bike SIM current interaction

on:
  push:
    branches:
      - agent/bike-sim-gradient-fix
    paths:
      - .github/workflows/patch-bike-sim-current.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bike-sim-gradient-fix
          fetch-depth: 0

      - name: Apply current Bike SIM corrections
        run: python scripts/patch-bike-sim-current.py

      - name: Validate JavaScript and required UI changes
        shell: bash
        run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          grep -q 'LED Bike Sim' build-my-bike.html
          grep -q 'Gradient length' js/sim-node-sequence.js
          grep -q 'Quarter of the LEDs' js/sim-node-sequence.js
          grep -q 'if (simulator === "bike") return;' js/sim-node-sequence.js
          grep -q 'min-height: 82px' css/sim-node-sequence.css
          ! grep -q 'sim-effect-preview' js/sim-node-sequence.js
          git diff --check

      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-bike-sim-current.py .github/workflows/patch-bike-sim-current.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Bike SIM selection and rainbow gradient controls"
          git push origin HEAD:agent/bike-sim-gradient-fix

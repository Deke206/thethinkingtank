name: Import row-complete BTF catalog

on:
  push:
    branches:
      - agent/row-complete-btf-catalog
    paths:
      - .github/workflows/import-btf-catalog-payload.yml

permissions:
  contents: write

jobs:
  import-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out catalog branch
        uses: actions/checkout@v4
        with:
          ref: agent/row-complete-btf-catalog
          fetch-depth: 0

      - name: Download verified catalog payload
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/btf-catalog-payload.zip 'https://at.adobe.com/avCxEjMmRab1iYlM'
          echo 'ec1435ab3d69a089df368baf4cd149d7ffeeaa9001f80f8b4f7acce9384a96ce  /tmp/btf-catalog-payload.zip' | sha256sum --check -

      - name: Replace catalog implementation atomically
        run: |
          set -euo pipefail
          rm -f data/btf-pack-*.js data/btf-catalog-meta.json data/btf-items-*.json data/btf-images-*.js
          unzip -o /tmp/btf-catalog-payload.zip -d .

      - name: Validate catalog and design chain
        run: |
          set -euo pipefail
          node --check data/btf-catalog.js
          node --check data/btf-recommendation-sets.js
          node --check js/catalog.js
          node --check js/customer-design-chain.js
          node --check js/project-recommendations.js
          python - <<'PY'
          import json
          from collections import Counter
          with open('data/btf-catalog-items.json', encoding='utf-8') as handle:
              catalog = json.load(handle)
          products = catalog['products']
          sources = Counter(item.get('source') for item in products)
          assert catalog['source']['quotationRows'] == 197
          assert catalog['source']['addressableRows'] == 131
          assert catalog['source']['fcobRows'] == 66
          assert catalog['source']['selectedSystems'] == 34
          assert catalog['totalItems'] == 231
          assert len(products) == 231
          assert len({item['id'] for item in products}) == 231
          assert sources['Addressable Pixel Strip Quotation List'] == 131
          assert sources['FCOB LED Strip Price List'] == 66
          assert sources['Previously selected ShyneTyme catalog'] == 34
          assert all(item.get('name') and item.get('category') for item in products)
          print('Validated 231 unique catalog records: 131 addressable + 66 FCOB + 34 selected systems')
          PY

      - name: Commit complete catalog payload
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-btf-catalog-payload.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Build row-complete BTF catalog from quotation PDFs'
          git push origin HEAD:agent/row-complete-btf-catalog

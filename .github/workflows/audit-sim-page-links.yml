name: Audit simulator page links

on:
  push:
    branches:
      - fix/sim-page-links
    paths:
      - .github/workflows/audit-sim-page-links.yml

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim-page-links
          fetch-depth: 0

      - name: Audit and repair internal paths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote

          root = Path.cwd()
          page_map = {
              "build-my-auto.html": "ledautosim.html",
              "build-my-bike.html": "ledbikesim.html",
              "build-my-home.html": "ledhomesim.html",
          }
          support_roots = ("css/", "data/", "docs/", "js/", "scripts/")
          text_suffixes = {
              ".html", ".htm", ".css", ".js", ".mjs", ".cjs", ".json",
              ".md", ".txt", ".xml", ".svg", ".yml", ".yaml", ".py",
              ".sh", ".ps1", ".toml", ".ini", ".cfg", ".csv"
          }
          excluded_parts = {".git"}

          def text_files():
              for path in root.rglob("*"):
                  if not path.is_file() or any(part in excluded_parts for part in path.parts):
                      continue
                  if path.suffix.lower() in text_suffixes or path.name in {"CNAME", ".nojekyll"}:
                      yield path

          # Complete repository-wide page rename, including assets and documentation.
          replacements = 0
          for path in text_files():
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = content
              for old, new in page_map.items():
                  updated = updated.replace(old, new)
              updated = updated.replace("assets/assets/", "assets/")
              if updated != content:
                  path.write_text(updated, encoding="utf-8")
                  replacements += 1

          all_files = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and ".git" not in p.parts
          }

          def clean_url(raw: str) -> str | None:
              value = raw.strip().strip('"\'')
              if not value:
                  return None
              if value.startswith(("http://", "https://", "//", "data:", "mailto:", "tel:", "javascript:", "blob:", "#", "{")):
                  return None
              if "${" in value or "{{" in value or "<%" in value:
                  return None
              value = unquote(value.split("#", 1)[0].split("?", 1)[0])
              if not value or value in {".", "..", "/"}:
                  return None
              return value

          def resolve(path: Path, url: str, mode: str) -> str:
              if url.startswith("/"):
                  return PurePosixPath(url.lstrip("/")).as_posix()
              if mode == "document-root":
                  return PurePosixPath(os.path.normpath(url)).as_posix()
              parent = path.relative_to(root).parent.as_posix()
              return PurePosixPath(os.path.normpath(str(PurePosixPath(parent) / url))).as_posix()

          def candidate_urls(path: Path, url: str, mode: str):
              seen = set()
              values = [url]
              for old, new in page_map.items():
                  values.append(url.replace(old, new))
              values.append(url.replace("assets/assets/", "assets/"))
              stripped = url.lstrip("/")
              if stripped.startswith(support_roots):
                  values.append("assets/" + stripped)
              if stripped.startswith("../assets/"):
                  values.append(stripped[3:])
              if mode == "file-relative" and stripped.startswith("assets/"):
                  parent = path.relative_to(root).parent.as_posix() or "."
                  values.append(os.path.relpath(stripped, parent).replace(os.sep, "/"))
              if mode == "file-relative" and path.suffix.lower() == ".css" and stripped.startswith("images/"):
                  values.append("../" + stripped)
              if mode == "document-root" and stripped.startswith("../"):
                  values.append(stripped.removeprefix("../"))
              for value in values:
                  if value not in seen:
                      seen.add(value)
                      yield value

          html_attr = re.compile(r'''\b(?:href|src|action|poster|data-src)\s*=\s*["']([^"']+)["']''', re.I)
          css_url = re.compile(r'''url\(\s*["']?([^"')]+)["']?\s*\)''', re.I)
          css_import = re.compile(r'''@import\s+(?:url\()?\s*["']([^"']+)["']''', re.I)
          js_runtime = re.compile(r'''(?:fetch\s*\(|\.src\s*=|\.href\s*=|new\s+Worker\s*\()\s*["'`]([^"'`]+)["'`]''')
          js_module = re.compile(r'''(?:from\s+|import\s*\()\s*["']([^"']+)["']''')
          markdown_link = re.compile(r'''!?\[[^\]]*\]\(([^)\s]+)''')

          missing = []
          repaired = []

          for path in list(text_files()):
              if path.as_posix().endswith(".github/workflows/audit-sim-page-links.yml"):
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              matches: list[tuple[str, str]] = []
              suffix = path.suffix.lower()
              if suffix in {".html", ".htm", ".xml", ".svg"}:
                  matches.extend((m.group(1), "file-relative") for m in html_attr.finditer(content))
              if suffix == ".css":
                  matches.extend((m.group(1), "file-relative") for m in css_url.finditer(content))
                  matches.extend((m.group(1), "file-relative") for m in css_import.finditer(content))
              if suffix in {".js", ".mjs", ".cjs"}:
                  matches.extend((m.group(1), "document-root") for m in js_runtime.finditer(content))
                  matches.extend((m.group(1), "file-relative") for m in js_module.finditer(content))
              if suffix == ".md":
                  matches.extend((m.group(1), "file-relative") for m in markdown_link.finditer(content))

              updated = content
              for raw, mode in matches:
                  url = clean_url(raw)
                  if url is None:
                      continue
                  original_target = resolve(path, url, mode)
                  if original_target in all_files:
                      continue

                  valid = []
                  for candidate in candidate_urls(path, url, mode):
                      target = resolve(path, candidate, mode)
                      if target in all_files:
                          valid.append((candidate, target))
                  valid = list(dict.fromkeys(valid))

                  if len(valid) == 1:
                      new_url, target = valid[0]
                      if new_url != url:
                          updated = updated.replace(raw, new_url)
                          repaired.append((path.relative_to(root).as_posix(), raw, new_url, target))
                  else:
                      missing.append((path.relative_to(root).as_posix(), raw, original_target, valid))

              if updated != content:
                  path.write_text(updated, encoding="utf-8")

          # Rebuild file set after repairs, then perform a second strict pass.
          all_files = {
              p.relative_to(root).as_posix()
              for p in root.rglob("*")
              if p.is_file() and ".git" not in p.parts
          }

          # Required architecture and named pages.
          required = [
              "ledautosim.html", "ledbikesim.html", "ledhomesim.html",
              "assets/css", "assets/data", "assets/docs", "assets/js", "assets/scripts",
              "assets/css/site.css", "assets/js/site-chuck.js",
              "assets/data/home-sim-approved-geometry.json",
              "assets/sim-auto/car-base-1.txt",
          ]
          for item in required:
              if not (root / item).exists():
                  missing.append(("<required>", item, item, []))

          for old in page_map:
              if (root / old).exists():
                  missing.append(("<old-page-still-present>", old, old, []))

          for old_root in ("css", "data", "docs", "js", "scripts"):
              if (root / old_root).exists():
                  missing.append(("<duplicate-root-folder>", old_root, old_root, []))

          print(f"Repository-wide filename replacements: {replacements}")
          print(f"Automatically repaired paths: {len(repaired)}")
          for record in repaired:
              print("REPAIRED", *record, sep=" | ")

          if missing:
              print("\nUNRESOLVED OR BROKEN LOCAL REFERENCES:")
              for record in missing:
                  print("BROKEN", *record, sep=" | ")
              raise SystemExit(f"Link audit failed with {len(missing)} unresolved references")

          print("All audited local references resolve to tracked repository files.")
          PY

      - name: Validate scripts and named pages
        shell: bash
        run: |
          set -euo pipefail
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          test -f ledautosim.html
          test -f ledbikesim.html
          test -f ledhomesim.html
          test ! -e build-my-auto.html
          test ! -e build-my-bike.html
          test ! -e build-my-home.html
          grep -RIl --exclude-dir=.git -E 'build-my-(auto|bike|home)\.html' . && exit 1 || true
          git diff --check

      - name: Local static preview smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/shynetyme-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for page in ledautosim.html ledbikesim.html ledhomesim.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$page" >/dev/null
          done
          for asset in \
            assets/css/site.css \
            assets/js/bike-builder.js \
            assets/js/home-sim.js \
            assets/js/sim-auto-sequence.js \
            assets/data/home-sim-approved-geometry.json \
            assets/sim-auto/car-base-1.txt; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$asset" >/dev/null
          done

      - name: Commit repairs to task branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-sim-page-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No file changes were required after the audit."
          else
            git commit -m "fix: repair simulator routes and asset links"
            git push origin HEAD:fix/sim-page-links
          fi

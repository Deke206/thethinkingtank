name: Audit simulator page links

on:
  push:
    branches:
      - fix/sim-page-links
    paths:
      - .github/workflows/audit-sim-page-links.yml

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sim-page-links
          fetch-depth: 0

      - name: Repair repository-wide simulator links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          workflow = root / ".github/workflows/audit-sim-page-links.yml"
          page_map = {
              "build-my-auto.html": "ledautosim.html",
              "build-my-bike.html": "ledbikesim.html",
              "build-my-home.html": "ledhomesim.html",
          }
          text_suffixes = {
              ".html", ".htm", ".css", ".js", ".mjs", ".cjs", ".json",
              ".md", ".txt", ".xml", ".svg", ".yml", ".yaml", ".py",
              ".sh", ".ps1", ".toml", ".ini", ".cfg", ".csv"
          }

          changed = []
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or path == workflow:
                  continue
              if path.suffix.lower() not in text_suffixes and path.name not in {"CNAME", ".nojekyll"}:
                  continue
              try:
                  original = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              updated = original
              for old, new in page_map.items():
                  updated = updated.replace(old, new)
              updated = updated.replace("assets/assets/", "assets/")
              if path.as_posix().endswith("assets/js/sim-auto-sequence.js"):
                  updated = updated.replace(
                      "../contact.html?source=sim-auto#contact-request",
                      "contact.html?source=sim-auto#contact-request",
                  )
              if updated != original:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(path.relative_to(root).as_posix())

          print("Changed files:")
          for path in changed:
              print(path)
          PY

      - name: Audit every local HTML, CSS, and JavaScript path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import os
          import re
          from pathlib import Path, PurePosixPath
          from urllib.parse import unquote

          root = Path.cwd()
          workflow = root / ".github/workflows/audit-sim-page-links.yml"
          all_files = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file() and ".git" not in path.parts
          }

          html_attr = re.compile(r'''\b(?:href|src|action|poster|data-src)\s*=\s*["']([^"']+)["']''', re.I)
          css_url = re.compile(r'''url\(\s*["']?([^"')]+)["']?\s*\)''', re.I)
          css_import = re.compile(r'''@import\s+(?:url\()?\s*["']([^"']+)["']''', re.I)
          js_runtime = re.compile(r'''(?:fetch\s*\(|\.src\s*=|\.href\s*=|new\s+Worker\s*\()\s*["'`]([^"'`]+)["'`]''')
          js_module = re.compile(r'''(?:from\s+|import\s*\()\s*["']([^"']+)["']''')

          ignored_prefixes = (
              "http://", "https://", "//", "data:", "mailto:", "tel:",
              "javascript:", "blob:", "node:", "#", "{"
          )

          def clean(raw: str):
              value = raw.strip().strip('"\'')
              if not value or value.startswith(ignored_prefixes):
                  return None
              if "${" in value or "{{" in value or "<%" in value:
                  return None
              value = unquote(value.split("#", 1)[0].split("?", 1)[0])
              if not value or value in {".", "..", "/"}:
                  return None
              return value

          def resolve(path: Path, value: str, document_root: bool):
              if value.startswith("/"):
                  return PurePosixPath(value.lstrip("/")).as_posix()
              if document_root:
                  normalized = os.path.normpath(value)
                  while normalized.startswith("../"):
                      normalized = normalized[3:]
                  return PurePosixPath(normalized).as_posix()
              parent = path.relative_to(root).parent.as_posix()
              return PurePosixPath(os.path.normpath(str(PurePosixPath(parent) / value))).as_posix()

          broken = []
          checked = 0
          for path in root.rglob("*"):
              if not path.is_file() or ".git" in path.parts or path == workflow:
                  continue
              suffix = path.suffix.lower()
              if suffix not in {".html", ".htm", ".xml", ".svg", ".css", ".js", ".mjs", ".cjs"}:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              refs = []
              if suffix in {".html", ".htm", ".xml", ".svg"}:
                  refs.extend((m.group(1), False) for m in html_attr.finditer(content))
              elif suffix == ".css":
                  refs.extend((m.group(1), False) for m in css_url.finditer(content))
                  refs.extend((m.group(1), False) for m in css_import.finditer(content))
              else:
                  refs.extend((m.group(1), True) for m in js_runtime.finditer(content))
                  refs.extend((m.group(1), False) for m in js_module.finditer(content))

              for raw, document_root in refs:
                  value = clean(raw)
                  if value is None:
                      continue
                  checked += 1
                  target = resolve(path, value, document_root)
                  if target not in all_files:
                      broken.append((path.relative_to(root).as_posix(), raw, target))

          required = [
              "ledautosim.html", "ledbikesim.html", "ledhomesim.html",
              "assets/css/site.css", "assets/js/bike-builder.js",
              "assets/js/home-sim.js", "assets/js/sim-auto-sequence.js",
              "assets/data/home-sim-approved-geometry.json",
              "assets/sim-auto/car-base-1.txt",
          ]
          for target in required:
              if target not in all_files:
                  broken.append(("<required>", target, target))

          old_names = ("build-my-auto.html", "build-my-bike.html", "build-my-home.html")
          for old_name in old_names:
              if old_name in all_files:
                  broken.append(("<old-page-present>", old_name, old_name))

          for old_root in ("css", "data", "docs", "js", "scripts"):
              if (root / old_root).exists():
                  broken.append(("<duplicate-root-folder>", old_root, old_root))

          print(f"Audited {checked} local references.")
          if broken:
              for record in broken:
                  print("BROKEN", *record, sep=" | ")
              raise SystemExit(f"Found {len(broken)} broken local references")
          print("All audited local references resolve.")
          PY

      - name: Validate scripts and renamed routes
        shell: bash
        run: |
          set -euo pipefail
          find assets/js -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          test -f ledautosim.html
          test -f ledbikesim.html
          test -f ledhomesim.html
          test ! -e build-my-auto.html
          test ! -e build-my-bike.html
          test ! -e build-my-home.html
          if grep -RIn --exclude-dir=.git --exclude=audit-sim-page-links.yml -E 'build-my-(auto|bike|home)\.html' .; then
            echo "Old simulator page references remain." >&2
            exit 1
          fi
          git diff --check

      - name: Local preview smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/shynetyme-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1
          for resource in \
            ledautosim.html \
            ledbikesim.html \
            ledhomesim.html \
            assets/css/site.css \
            assets/css/bike-builder.css \
            assets/css/home-sim.css \
            assets/js/bike-builder.js \
            assets/js/home-sim.js \
            assets/js/sim-auto-sequence.js \
            assets/data/home-sim-approved-geometry.json \
            assets/sim-auto/car-base-1.txt; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$resource" >/dev/null
          done

      - name: Commit verified repairs to task branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/audit-sim-page-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: repair simulator routes and asset links"
          git push origin HEAD:fix/sim-page-links

name: Fix root navigation links v2

on:
  push:
    branches:
      - agent/fix-root-navigation-links
    paths:
      - .github/workflows/fix-root-navigation-links-v2.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-root-navigation-links
          fetch-depth: 0

      - name: Correct every stale site-root resolver
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          normal_files = [
              Path("assets/js/site-chuck.js"),
              Path("assets/js/site-guide.js"),
              Path("assets/js/customer-design-chain.js"),
              Path("assets/js/home-sim.js"),
              Path("assets/js/work-history.js"),
          ]
          old = 'const siteRoot = new URL("../", scriptUrl);'
          new = 'const siteRoot = new URL("../../", scriptUrl);'
          for path in normal_files:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Unexpected siteRoot count in {path}: {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          loader = Path("assets/js/home-sim.js")
          text = loader.read_text(encoding="utf-8")
          marker = "    sourceParts: SOURCE_PARTS,\n    load: loadHomeSimController"
          replacement = "    sourceParts: SOURCE_PARTS,\n    siteRoot: siteRoot.href,\n    load: loadHomeSimController"
          if text.count(marker) != 1:
              raise SystemExit("Home SIM loader API marker mismatch")
          loader.write_text(text.replace(marker, replacement), encoding="utf-8")

          source_old = 'const siteRoot = new URL("../", scriptUrl);'
          source_new = '''const siteRoot = new URL(
            window.ShynetymeHomeSimLoader?.siteRoot || window.location.href
          );'''
          for path in [
              Path("assets/js/home-sim-source/home-sim-part-01.txt"),
              Path("assets/js/home-sim-source/home-sim-part-05.txt"),
          ]:
              text = path.read_text(encoding="utf-8")
              if text.count(source_old) != 1:
                  raise SystemExit(f"Unexpected Home SIM source root count in {path}: {text.count(source_old)}")
              path.write_text(text.replace(source_old, source_new), encoding="utf-8")
          PY

      - name: Verify root navigation and migrated assets
        shell: bash
        run: |
          set -euo pipefail
          test -f ledbikesim.html
          test -f ledautosim.html
          test -f ledhomesim.html
          test ! -e assets/ledbikesim.html
          test ! -e assets/ledautosim.html
          test ! -e assets/ledhomesim.html

          ! grep -RIn --exclude-dir=.git -E 'assets/(ledbike|ledauto|ledhome)sim\.html' .
          ! grep -RIn --exclude-dir=.git --exclude='fix-root-navigation-links*.yml' 'const siteRoot = new URL("../", scriptUrl);' assets/js

          node <<'NODE'
          const assert = require('node:assert/strict');
          for (const file of ['site-chuck.js', 'site-guide.js', 'customer-design-chain.js']) {
            const scriptUrl = new URL(`https://shynetyme.works/assets/js/${file}`);
            const root = new URL('../../', scriptUrl);
            assert.equal(root.href, 'https://shynetyme.works/');
            assert.equal(new URL('ledbikesim.html', root).pathname, '/ledbikesim.html');
            assert.equal(new URL('ledautosim.html', root).pathname, '/ledautosim.html');
            assert.equal(new URL('ledhomesim.html', root).pathname, '/ledhomesim.html');
          }
          NODE

          find assets/js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          cat assets/js/home-sim-source/home-sim-part-{00,01,02,03,04,05}.txt > /tmp/home-sim-controller.js
          node --check /tmp/home-sim-controller.js
          git diff --check

      - name: Local route smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/nav-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          sleep 1
          for path in ledbikesim.html ledautosim.html ledhomesim.html assets/js/site-chuck.js assets/js/site-guide.js assets/js/customer-design-chain.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$path" >/dev/null
          done
          for path in assets/ledbikesim.html assets/ledautosim.html assets/ledhomesim.html; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080/$path")
            test "$code" = "404"
          done

      - name: Commit only verified production files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-root-navigation-links.yml .github/workflows/fix-root-navigation-links-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js .github/workflows
          git commit -m "fix: resolve navigation from site root"
          git push origin HEAD:agent/fix-root-navigation-links

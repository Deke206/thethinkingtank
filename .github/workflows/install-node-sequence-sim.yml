name: Install unified node sequence simulator

on:
  push:
    branches:
      - agent/unified-node-sequence-sim
    paths:
      - .github/workflows/install-node-sequence-sim.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-node-sequence-sim
          fetch-depth: 0

      - name: Install shared node sequence engine
        shell: bash
        run: |
          set -euo pipefail
          gzip --decompress --stdout tmp/sim-node-sequence.js.gz > js/sim-node-sequence.js
          gzip --decompress --stdout tmp/sim-node-sequence.css.gz > css/sim-node-sequence.css

      - name: Connect Bike Home and Auto pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def insert_once(text, marker, insertion):
              if insertion.strip() in text:
                  return text
              if marker not in text:
                  raise SystemExit(f"Missing insertion marker: {marker}")
              return text.replace(marker, marker + insertion, 1)

          bike = Path("build-my-bike.html")
          text = bike.read_text(encoding="utf-8")
          text = insert_once(
              text,
              '<link rel="stylesheet" href="css/bike-builder.css">',
              '\n  <link rel="stylesheet" href="css/sim-node-sequence.css?v=20260806-node-sequence-v2">'
          )
          if 'src="js/sim-preset-core.js?v=20260806-node-sequence-v2"' not in text:
              text = text.replace(
                  '<script src="js/bike-builder.js"></script>',
                  '<script src="js/sim-preset-core.js?v=20260806-node-sequence-v2"></script>\n  <script src="js/bike-builder.js"></script>',
                  1
              )
          text = insert_once(
              text,
              '<script src="js/bike-builder.js"></script>',
              '\n  <script src="js/sim-node-sequence.js?v=20260806-node-sequence-v2"></script>'
          )
          bike.write_text(text, encoding="utf-8")

          home = Path("build-my-home.html")
          text = home.read_text(encoding="utf-8")
          text = insert_once(
              text,
              '<link rel="stylesheet" href="css/home-sim.css?v=20260805-production-home-v1">',
              '\n  <link rel="stylesheet" href="css/sim-node-sequence.css?v=20260806-node-sequence-v2">'
          )
          text = insert_once(
              text,
              '<script src="js/home-sim.js?v=20260805-production-home-v1"></script>',
              '\n  <script src="js/sim-node-sequence.js?v=20260806-node-sequence-v2"></script>'
          )
          home.write_text(text, encoding="utf-8")

          auto = Path("build-my-auto.html")
          text = auto.read_text(encoding="utf-8")
          old_css = '../css/sim-auto-sequence.css?v=20260806-auto-sequence-v1'
          old_js = '../js/sim-auto-sequence.js?v=20260806-auto-sequence-v1'
          if old_css not in text or old_js not in text:
              raise SystemExit("Auto sequence loader markers are missing.")
          text = text.replace(old_css, '../css/sim-node-sequence.css?v=20260806-node-sequence-v2')
          text = text.replace(old_js, '../js/sim-node-sequence.js?v=20260806-node-sequence-v2')
          text = text.replace('shynetymeAutoSequenceStyles', 'shynetymeNodeSequenceStyles')
          text = text.replace('shynetymeAutoSequence', 'shynetymeNodeSequence')
          auto.write_text(text, encoding="utf-8")
          PY

      - name: Validate simulator files and page wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          python - <<'PY'
          from pathlib import Path

          js = Path('js/sim-node-sequence.js').read_text(encoding='utf-8')
          css = Path('css/sim-node-sequence.css').read_text(encoding='utf-8')
          assert js.count('const PRESETS') == 1
          assert 'Array.from({ length: 10 }' in js
          assert 'SP803E' in js and 'SP630E' in js and 'SP530E' in js
          assert css.count('{') == css.count('}')
          for page in ['build-my-bike.html', 'build-my-home.html', 'build-my-auto.html']:
              text = Path(page).read_text(encoding='utf-8')
              assert 'sim-node-sequence.js' in text, page
              assert 'sim-node-sequence.css' in text, page
          auto = Path('build-my-auto.html').read_text(encoding='utf-8')
          assert 'sim-auto-sequence.js?v=20260806-auto-sequence-v1' not in auto
          print('Unified controller-node simulator validation passed.')
          PY
          git diff --check

      - name: Commit validated simulator
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/sim-node-sequence.js.gz tmp/sim-node-sequence.css.gz
          rm -f .github/workflows/install-node-sequence-sim.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build unified controller-node sequence simulators"
          git push origin HEAD:agent/unified-node-sequence-sim

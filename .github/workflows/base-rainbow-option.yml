name: Base Rainbow option
on:
  push:
    branches: [agent/base-rainbow-option]
    paths: [.github/workflows/base-rainbow-option.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/base-rainbow-option
          fetch-depth: 0
      - run: python scripts/base-rainbow-option.py
      - run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          grep -q 'id: "base-rainbow"' js/sim-node-sequence.js
          grep -q 'RAINBOW_COLORS.map' js/sim-node-sequence.js
          grep -q 'const isBaseRainbow' js/sim-node-sequence.js
          ! grep -q 'defaultRainbowDemoRecipe' js/sim-node-sequence.js
          ! grep -q 'Default showroom state' js/sim-node-sequence.js
          git diff --check
      - run: |
          set -euo pipefail
          rm -f scripts/base-rainbow-option.py .github/workflows/base-rainbow-option.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Base Rainbow without auto-enabling areas"
          git push origin HEAD:agent/base-rainbow-option

name: Fix root navigation links

on:
  push:
    branches:
      - agent/fix-root-navigation-links
    paths:
      - .github/workflows/fix-root-navigation-links.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-root-navigation-links
          fetch-depth: 0

      - name: Correct site-root resolution after assets migration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          normal_files = [
              Path("assets/js/site-chuck.js"),
              Path("assets/js/site-guide.js"),
              Path("assets/js/customer-design-chain.js"),
              Path("assets/js/home-sim.js"),
              Path("assets/js/work-history.js"),
          ]

          old = 'const siteRoot = new URL("../", scriptUrl);'
          new = 'const siteRoot = new URL("../../", scriptUrl);'

          for path in normal_files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one old siteRoot resolver in {path}; found {count}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          loader = Path("assets/js/home-sim.js")
          text = loader.read_text(encoding="utf-8")
          marker = "    sourceParts: SOURCE_PARTS,\n    load: loadHomeSimController"
          replacement = "    sourceParts: SOURCE_PARTS,\n    siteRoot: siteRoot.href,\n    load: loadHomeSimController"
          if text.count(marker) != 1:
              raise SystemExit("Home SIM loader API marker was not found exactly once")
          loader.write_text(text.replace(marker, replacement), encoding="utf-8")

          source_files = [
              Path("assets/js/home-sim-source/home-sim-part-01.txt"),
              Path("assets/js/home-sim-source/home-sim-part-05.txt"),
          ]
          old_block = '''  const scriptUrl = document.currentScript?.src
            ? new URL(document.currentScript.src, window.location.href)
            : new URL("assets/js/home-sim.js", window.location.href);
          const siteRoot = new URL("../", scriptUrl);'''
          new_block = '''  const siteRoot = new URL(
            window.ShynetymeHomeSimLoader?.siteRoot || window.location.href
          );'''

          for path in source_files:
              text = path.read_text(encoding="utf-8")
              count = text.count(old_block)
              if count != 1:
                  raise SystemExit(f"Expected one blob-source root block in {path}; found {count}")
              path.write_text(text.replace(old_block, new_block), encoding="utf-8")
          PY

      - name: Verify generated navigation URLs and repository paths
        shell: bash
        run: |
          set -euo pipefail

          test -f ledbikesim.html
          test -f ledautosim.html
          test -f ledhomesim.html
          test ! -e assets/ledbikesim.html
          test ! -e assets/ledautosim.html
          test ! -e assets/ledhomesim.html

          if grep -RIn --exclude-dir=.git -E 'assets/(ledbike|ledauto|ledhome)sim\.html' .; then
            echo "A simulator page is still incorrectly linked under assets/." >&2
            exit 1
          fi

          if grep -RIn --exclude-dir=.git --exclude=fix-root-navigation-links.yml 'const siteRoot = new URL("../", scriptUrl);' assets/js; then
            echo "An obsolete one-level siteRoot resolver remains under assets/js." >&2
            exit 1
          fi

          node <<'NODE'
          const assert = require('node:assert/strict');
          const scriptUrl = new URL('https://shynetyme.works/assets/js/site-chuck.js');
          const siteRoot = new URL('../../', scriptUrl);
          assert.equal(siteRoot.href, 'https://shynetyme.works/');
          assert.equal(new URL('ledbikesim.html', siteRoot).href, 'https://shynetyme.works/ledbikesim.html');
          assert.equal(new URL('ledautosim.html', siteRoot).href, 'https://shynetyme.works/ledautosim.html');
          assert.equal(new URL('ledhomesim.html', siteRoot).href, 'https://shynetyme.works/ledhomesim.html');
          assert.equal(new URL('assets/css/site.css', siteRoot).href, 'https://shynetyme.works/assets/css/site.css');
          NODE

          find assets/js -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          cat assets/js/home-sim-source/home-sim-part-{00,01,02,03,04,05}.txt > /tmp/home-sim-controller.js
          node --check /tmp/home-sim-controller.js
          git diff --check

      - name: Local HTTP smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/shynetyme-nav-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          sleep 1

          for resource in \
            ledbikesim.html \
            ledautosim.html \
            ledhomesim.html \
            assets/js/site-chuck.js \
            assets/js/site-guide.js \
            assets/js/customer-design-chain.js \
            assets/js/home-sim.js \
            assets/js/work-history.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$resource" >/dev/null
          done

          for retired in \
            assets/ledbikesim.html \
            assets/ledautosim.html \
            assets/ledhomesim.html; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080/$retired")
            test "$code" = "404"
          done

      - name: Commit verified correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-root-navigation-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js
          git commit -m "fix: resolve navigation from site root"
          git push origin HEAD:agent/fix-root-navigation-links

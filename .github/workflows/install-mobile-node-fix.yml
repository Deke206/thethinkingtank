name: Install corrected mobile simulator files

on:
  push:
    branches:
      - agent/unified-node-sequence-sim
    paths:
      - .github/workflows/install-mobile-node-fix.yml

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-node-sequence-sim
          fetch-depth: 0

      - name: Install and validate JavaScript and CSS
        shell: bash
        run: |
          set -euo pipefail
          gzip --test tmp/sim-node-sequence-mobile.js.gz
          gzip --test tmp/sim-node-sequence-mobile.css.gz
          gzip --decompress --stdout tmp/sim-node-sequence-mobile.js.gz > js/sim-node-sequence.js
          gzip --decompress --stdout tmp/sim-node-sequence-mobile.css.gz > css/sim-node-sequence.css
          node --check js/sim-node-sequence.js
          grep -Fq '<span>nodes</span>' js/sim-node-sequence.js
          grep -Fq 'grid-template-columns: minmax(0, 1fr) 76px' css/sim-node-sequence.css
          python - <<'PY'
          from pathlib import Path

          css = Path('css/sim-node-sequence.css').read_text(encoding='utf-8')
          js = Path('js/sim-node-sequence.js').read_text(encoding='utf-8')
          assert css.count('{') == css.count('}')
          assert '.sim-workbench-header > div' in css
          assert '.sim-sequence-panel,' in css
          assert 'Array.from({ length: 10 }' in js
          assert js.count('label: "') >= 25
          print('Corrected mobile node-sequence validation passed.')
          PY
          git diff --check

      - name: Commit validated files and remove installer
        shell: bash
        run: |
          set -euo pipefail
          rm -f tmp/sim-node-sequence-mobile.js.gz tmp/sim-node-sequence-mobile.css.gz
          rm -f .github/workflows/install-mobile-node-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix node simulator mobile overflow'
          git push origin HEAD:agent/unified-node-sequence-sim

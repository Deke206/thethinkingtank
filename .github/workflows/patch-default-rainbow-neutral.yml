name: Patch neutral default rainbow

on:
  push:
    branches:
      - agent/default-rainbow-neutral-v2
    paths:
      - .github/workflows/patch-default-rainbow-neutral.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/default-rainbow-neutral-v2
          fetch-depth: 0
      - name: Apply neutral default Rainbow and Bike overlay cleanup
        run: python scripts/patch-default-rainbow-neutral.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/sim-node-sequence.js
          grep -q 'function applyDefaultRainbow' js/sim-node-sequence.js
          grep -q 'Default rainbow' js/sim-node-sequence.js
          grep -q 'if (stored?.version !== 3' js/sim-node-sequence.js
          grep -q 'element.classList.remove("zone-on", "zone-off")' js/sim-node-sequence.js
          grep -q 'fill: none !important' css/sim-node-sequence.css
          grep -q 'editorRecipe = defaultRainbowDemoRecipe()' js/sim-node-sequence.js
          ! grep -q 'area.active = true;' js/sim-node-sequence.js
          git diff --check
      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-default-rainbow-neutral.py .github/workflows/patch-default-rainbow-neutral.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make base rainbow a neutral SIM default"
          git push origin HEAD:agent/default-rainbow-neutral-v2

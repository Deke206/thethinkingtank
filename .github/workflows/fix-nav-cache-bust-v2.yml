name: Fix navigation cache bust v2

on:
  push:
    branches:
      - agent/fix-nav-cache-bust
    paths:
      - .github/workflows/fix-nav-cache-bust-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-nav-cache-bust
          fetch-depth: 0
      - name: Use a revision newer than every existing shared UI token
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          token = 'shared-ui-17'
          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              new = re.sub(r'assets/js/site-guide\.js\?v=shared-ui-[0-9]+',
                           f'assets/js/site-guide.js?v={token}', text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.as_posix())
          guide = Path('assets/js/site-guide.js')
          text = guide.read_text(encoding='utf-8')
          text = re.sub(r'scriptUrl\.searchParams\.get\("v"\) \|\| "shared-ui-[0-9]+"',
                        'scriptUrl.searchParams.get("v") || "shared-ui-17"', text)
          guide.write_text(text, encoding='utf-8')
          print('Updated:', ', '.join(changed))
          PY
          node --check assets/js/site-guide.js
          grep -Fq 'const siteRoot = new URL("../../", scriptUrl);' assets/js/site-guide.js
          grep -Fq 'scriptUrl.searchParams.get("v") || "shared-ui-17"' assets/js/site-guide.js
          count=$(grep -l 'assets/js/site-guide.js?v=shared-ui-17' ./*.html | wc -l)
          test "$count" -ge 7
          if grep -RInE --include='*.html' 'assets/js/site-guide\.js\?v=shared-ui-([0-9]|1[0-6])([^0-9]|$)' .; then
            echo 'A stale shared UI revision remains.' >&2
            exit 1
          fi
      - name: Commit production files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-nav-cache-bust-v2.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: bump shared navigation revision to 17'
          git push origin HEAD:agent/fix-nav-cache-bust

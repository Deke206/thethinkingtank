name: Fix root navigation links v3

on:
  push:
    branches:
      - agent/fix-root-navigation-links
    paths:
      - .github/workflows/fix-root-navigation-links-v3.yml

permissions:
  contents: write

jobs:
  fix-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-root-navigation-links
          fetch-depth: 0

      - name: Correct site-root resolution
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          standard = [
              "assets/js/site-chuck.js",
              "assets/js/site-guide.js",
              "assets/js/customer-design-chain.js",
              "assets/js/home-sim.js",
              "assets/js/work-history.js",
          ]
          old = 'const siteRoot = new URL("../", scriptUrl);'
          new = 'const siteRoot = new URL("../../", scriptUrl);'
          for name in standard:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one stale resolver in {name}; found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          loader = Path("assets/js/home-sim.js")
          text = loader.read_text(encoding="utf-8")
          old_api = "    sourceParts: SOURCE_PARTS,\n    load: loadHomeSimController"
          new_api = "    sourceParts: SOURCE_PARTS,\n    siteRoot: siteRoot.href,\n    load: loadHomeSimController"
          if text.count(old_api) != 1:
              raise SystemExit("Home SIM loader API marker mismatch")
          loader.write_text(text.replace(old_api, new_api), encoding="utf-8")

          source_old = 'const siteRoot = new URL("../", scriptUrl);'
          source_new = '''const siteRoot = new URL(
            window.ShynetymeHomeSimLoader?.siteRoot || window.location.href
          );'''
          for name in [
              "assets/js/home-sim-source/home-sim-part-01.txt",
              "assets/js/home-sim-source/home-sim-part-05.txt",
          ]:
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if text.count(source_old) != 1:
                  raise SystemExit(f"Expected one stale source resolver in {name}; found {text.count(source_old)}")
              path.write_text(text.replace(source_old, source_new), encoding="utf-8")
          PY

      - name: Verify navigation targets
        shell: bash
        run: |
          set -euo pipefail
          test -f ledbikesim.html
          test -f ledautosim.html
          test -f ledhomesim.html
          test ! -e assets/ledbikesim.html
          test ! -e assets/ledautosim.html
          test ! -e assets/ledhomesim.html

          if grep -RIn --exclude-dir=.git -E 'assets/(ledbike|ledauto|ledhome)sim\.html' assets *.html *.xml 2>/dev/null; then
            echo "A production file still points to a simulator under assets/." >&2
            exit 1
          fi

          if grep -RIn --exclude-dir=.git 'const siteRoot = new URL("../", scriptUrl);' assets/js; then
            echo "A stale one-level site-root resolver remains." >&2
            exit 1
          fi

          node <<'NODE'
          const assert = require('node:assert/strict');
          const root = new URL('../../', new URL('https://shynetyme.works/assets/js/site-chuck.js'));
          assert.equal(root.href, 'https://shynetyme.works/');
          const expected = {
            'ledbikesim.html': '/ledbikesim.html',
            'ledautosim.html': '/ledautosim.html',
            'ledhomesim.html': '/ledhomesim.html'
          };
          for (const [page, pathname] of Object.entries(expected)) {
            assert.equal(new URL(page, root).pathname, pathname);
          }
          NODE

          for file in \
            assets/js/site-chuck.js \
            assets/js/site-guide.js \
            assets/js/customer-design-chain.js \
            assets/js/home-sim.js \
            assets/js/work-history.js; do
            node --check "$file"
          done

          grep -Fq 'window.ShynetymeHomeSimLoader?.siteRoot || window.location.href' assets/js/home-sim-source/home-sim-part-01.txt
          grep -Fq 'window.ShynetymeHomeSimLoader?.siteRoot || window.location.href' assets/js/home-sim-source/home-sim-part-05.txt
          git diff --check

      - name: Local route smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/nav-preview.log 2>&1 &
          pid=$!
          trap 'kill "$pid"' EXIT
          sleep 1
          for path in \
            ledbikesim.html \
            ledautosim.html \
            ledhomesim.html \
            assets/js/site-chuck.js \
            assets/js/site-guide.js \
            assets/js/customer-design-chain.js; do
            curl --fail --silent --show-error "http://127.0.0.1:8080/$path" >/dev/null
          done
          for path in assets/ledbikesim.html assets/ledautosim.html assets/ledhomesim.html; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8080/$path")
            test "$code" = "404"
          done

      - name: Commit production correction
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-root-navigation-links.yml \
                .github/workflows/fix-root-navigation-links-v2.yml \
                .github/workflows/fix-root-navigation-links-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js .github/workflows
          git commit -m "fix: resolve navigation from site root"
          git push origin HEAD:agent/fix-root-navigation-links

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading SIM Auto | ShyneTyme.Works</title>
  <meta name="description" content="Loading the interactive ShyneTyme.Works SIM Auto LED lighting selector.">
  <meta name="theme-color" content="#03050b">
  <link rel="canonical" href="https://shynetyme.works/sim/ledsimauto.html">
  <style>
    html, body { margin: 0; min-height: 100%; background: #03050b; color: #fff; font-family: system-ui, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
    strong { color: #9b5cff; }
    p { color: #aeb6c7; }
  </style>
</head>
<body>
  <main><div><strong>ShyneTyme.Works</strong><p>Loading SIM Auto…</p></div></main>
  <script>
    (async () => {
      try {
        const paths = [
          '../assets/sim-auto/page-0.txt',
          '../assets/sim-auto/page-1.txt',
          '../assets/sim-auto/page-tail-0.txt',
          '../assets/sim-auto/page-tail-1.txt',
          '../assets/sim-auto/page-tail-2.txt',
          '../assets/sim-auto/page-tail-3.txt',
          '../assets/sim-auto/page-tail-4.txt'
        ];
        const parts = await Promise.all(paths.map(async path => {
          const response = await fetch(path, { cache: 'force-cache' });
          if (!response.ok) throw new Error(`${path}: ${response.status}`);
          return (await response.text()).trim();
        }));
        const binary = atob(parts.join(''));
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        const html = new TextDecoder().decode(bytes);
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        console.error('SIM Auto failed to load.', error);
        document.querySelector('main').innerHTML = '<div><strong>SIM Auto could not load.</strong><p>Please refresh the page.</p></div>';
      }
    })();
  </script>
</body>
</html>

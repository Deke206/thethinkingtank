<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>LED Auto Simulator | ShyneTyme Works</title>
<meta name="theme-color" content="#030918">
<style>
html,body{margin:0;min-height:100%;display:grid;place-items:center;background:#030918;color:#fff;font-family:Inter,system-ui,sans-serif}main{text-align:center;padding:2rem}h1{font-size:clamp(1.5rem,5vw,2.5rem)}p{color:#b8c6dc}.dot{width:14px;height:14px;margin:1rem auto;border-radius:50%;background:#ff3bd4;box-shadow:0 0 18px #ff3bd4;animation:p .9s ease-in-out infinite alternate}@keyframes p{to{opacity:.25;transform:scale(.7)}}
</style>
</head>
<body><main><h1>Loading LED SIM Auto...</h1><div class="dot"></div><p>Preparing aligned lighting effects.</p></main>
<script>
(async()=>{try{
 const parts=await Promise.all([1,2,3,4,5,6].map(async n=>{
  const response=await fetch(`../assets/sim-auto/car-base-${n}.txt?v=20260730-sim-style-budget-v5`,{cache:'no-store'});
  if(!response.ok)throw new Error(`page chunk ${n}`);
  return (await response.text()).trim();
 }));
 const binary=atob(parts.join(''));
 const bytes=Uint8Array.from(binary,character=>character.charCodeAt(0));
 let html=new TextDecoder('utf-8').decode(bytes);
 html=html.replaceAll('Â','').replaceAll('·',' - ');
 const parsed=new DOMParser().parseFromString(html,'text/html');
 const center=parsed.querySelector('section.auto-card.center');
 const summary=[...parsed.querySelectorAll('aside.auto-card.auto-side')].find(element=>element.textContent.includes('Your build preview'));
 if(!center||!summary)throw new Error('summary layout target');
 summary.classList.remove('auto-card');
 summary.classList.add('build-summary');
 center.append(summary);
 const layoutStyle=parsed.createElement('style');
 layoutStyle.textContent='.auto-grid{grid-template-columns:280px minmax(0,1fr)!important;align-items:start}.build-summary{border-top:1px solid #ffffff1a;background:linear-gradient(180deg,#0a1020,#050810);box-shadow:inset 0 1px 0 #ffffff08}.build-summary h2{margin-bottom:.6rem}.build-summary .summary{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.4rem}.build-summary .sumrow{border:1px solid #ffffff12;border-radius:.55rem}.build-summary .control,.build-summary .estimate{max-width:720px}.build-summary .btn-auto{max-width:360px;margin-right:.45rem}@media(max-width:1050px){.auto-grid{grid-template-columns:1fr!important}}';
 parsed.head.append(layoutStyle);
 const output='<!doctype html>\n'+parsed.documentElement.outerHTML;
 document.open();document.write(output);document.close();
}catch(error){
 document.querySelector('main').innerHTML='<h1>LED SIM Auto could not load</h1><p>Please refresh this page.</p>';
 console.error(error);
}})();
</script></body></html>

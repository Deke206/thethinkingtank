<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LED AutoSim — Edit Version 1</title><style>body{margin:0;background:#050912;color:#eef7ff;font:15px system-ui}.app{max-width:1400px;margin:auto;padding:18px}.views{display:flex;gap:8px;margin:12px 0}.views button{padding:10px 14px;background:#0b1320;color:#fff;border:1px solid #253247;border-radius:10px}.views .on{border-color:#35e7ff}.stage{height:620px;position:relative;border:1px solid #2c3b52;border-radius:18px;overflow:hidden;background:radial-gradient(circle,#16243a,#02050a)}.scene{display:none;position:absolute;inset:0}.scene.on{display:block}.scene svg{width:100%;height:100%}.led{fill:none;stroke:#35e7ff;stroke-width:8;stroke-linecap:round;filter:drop-shadow(0 0 8px #35e7ff);stroke-dasharray:14 10;animation:f 1.2s linear infinite}.pink{stroke:#ff4fd8;filter:drop-shadow(0 0 8px #ff4fd8)}.amber{stroke:#ffb347;filter:drop-shadow(0 0 8px #ffb347)}@keyframes f{to{stroke-dashoffset:-48}}.cap{position:absolute;z-index:3;left:18px;top:18px;background:#000b;padding:10px;border-radius:10px}.zones{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.zone{padding:12px;background:#0b1320;color:#fff;border:1px solid #253247;border-radius:10px}@media(max-width:700px){.zones{grid-template-columns:1fr 1fr}.stage{height:430px}}</style></head><body><div class="app"><h1>LED AutoSim — Edit Version 1</h1><p>Four-view mapped-lighting proof: Side, Front, Rear and Interior Top.</p><div class="views"><button class="on" data-v="side">Side</button><button data-v="front">Front</button><button data-v="rear">Rear</button><button data-v="interior">Interior Top</button></div><div class="stage"><section class="scene on" id="side"><div class="cap">Executive Sedan — Side View</div><svg viewBox="0 0 1200 650"><path d="M120 430Q155 350 270 330L390 205Q440 165 550 160H710Q790 165 860 235L955 330Q1055 345 1090 420L1070 475H130Z" fill="#8798aa" stroke="#dbe5ef" stroke-width="3"/><circle cx="315" cy="470" r="92" fill="#07090c"/><circle cx="315" cy="470" r="58" fill="#273341"/><circle cx="885" cy="470" r="92" fill="#07090c"/><circle cx="885" cy="470" r="58" fill="#273341"/><circle class="led pink" cx="315" cy="470" r="50"/><circle class="led pink" cx="885" cy="470" r="50"/><path class="led amber" d="M225 425A100 100 0 0 1 405 425M795 425A100 100 0 0 1 975 425"/><path class="led" d="M420 458Q600 472 780 458M390 505Q600 535 810 505"/></svg></section><section class="scene" id="front"><div class="cap">Executive Sedan — Front View</div><svg viewBox="0 0 1200 650"><path d="M250 470Q275 240 420 185Q600 125 780 185Q925 240 950 470L900 520H300Z" fill="#8798aa"/><path d="M395 255Q600 160 805 255L760 340H440Z" fill="#162b40"/><path class="led" d="M310 360Q385 325 455 350M745 350Q815 325 890 360"/><path class="led pink" d="M475 390H725"/><path class="led amber" d="M500 465Q600 485 700 465"/></svg></section><section class="scene" id="rear"><div class="cap">Executive Sedan — Rear View</div><svg viewBox="0 0 1200 650"><path d="M250 475Q275 255 420 205Q600 155 780 205Q925 255 950 475L900 520H300Z" fill="#8798aa"/><path class="led pink" d="M300 365Q385 330 470 355M730 355Q815 330 900 365"/><path class="led" d="M455 395H745"/><path class="led amber" d="M480 470Q600 492 720 470"/></svg></section><section class="scene" id="interior"><div class="cap">Executive Sedan — Interior Top View</div><svg viewBox="0 0 1200 650"><rect x="315" y="70" width="570" height="510" rx="170" fill="#151d27" stroke="#7c8da0" stroke-width="5"/><rect x="425" y="285" width="135" height="105" rx="28" fill="#303b48"/><rect x="640" y="285" width="135" height="105" rx="28" fill="#303b48"/><rect x="425" y="430" width="135" height="105" rx="28" fill="#303b48"/><rect x="640" y="430" width="135" height="105" rx="28" fill="#303b48"/><path class="led" d="M405 215Q600 245 795 215"/><path class="led pink" d="M350 180V470M850 180V470"/><path class="led amber" d="M600 270V500"/><path class="led" d="M455 405H545M655 405H745"/></svg></section></div><div class="zones"><button class="zone" data-t="side">Wheel / Wheel Well</button><button class="zone" data-t="front">Headlights / Grille</button><button class="zone" data-t="rear">Rear Lighting</button><button class="zone" data-t="interior">Interior Ambient</button></div></div><script>const bs=[...document.querySelectorAll('[data-v]')],ss=[...document.querySelectorAll('.scene')];function show(id){bs.forEach(b=>b.classList.toggle('on',b.dataset.v===id));ss.forEach(s=>s.classList.toggle('on',s.id===id))}bs.forEach(b=>b.onclick=()=>show(b.dataset.v));document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>show(b.dataset.t));</script></body></html>
